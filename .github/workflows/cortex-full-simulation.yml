name: Cortex Full Application Simulation

on:
  push:
    branches: [ "v86/work-vault" ]
    paths:
      - "app/src/main/**"
      - "app/src/test/**"
      - ".github/workflows/cortex-full-simulation.yml"
      - "app/build.gradle"
      - "build.gradle"
      - "settings.gradle"

concurrency:
  group: cortex-full-simulation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: "8.9"

      - name: Run full Cortex unit and integration simulation suite
        run: gradle :app:testDebugUnitTest --stacktrace --info

      - name: Extract full-application simulation verdict
        if: always()
        shell: bash
        run: |
          echo "=== Cortex Full Application Simulation ==="
          if [ -d app/build/test-results/testDebugUnitTest ]; then
            total=$(grep -Rho '<testcase ' app/build/test-results/testDebugUnitTest 2>/dev/null | wc -l || true)
            failures=$(grep -Rho '<failure' app/build/test-results/testDebugUnitTest 2>/dev/null | wc -l || true)
            errors=$(grep -Rho '<error' app/build/test-results/testDebugUnitTest 2>/dev/null | wc -l || true)
            skipped=$(grep -Rho '<skipped' app/build/test-results/testDebugUnitTest 2>/dev/null | wc -l || true)
            echo "TEST_CASES=$total"
            echo "FAILURES=$failures"
            echo "ERRORS=$errors"
            echo "SKIPPED=$skipped"
          fi
          grep -R "CORTEX_SIMULATION" app/build/test-results app/build/reports 2>/dev/null || true

      - name: Upload simulation reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cortex-full-simulation-report
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn
