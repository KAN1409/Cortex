name: Cortex Final Publish Acceptance

on:
  workflow_dispatch:
  push:
    branches:
      - v86/work-vault
    paths:
      - 'app/**'
      - '.github/workflows/cortex-final-publish-acceptance.yml'
      - '.github/scripts/cortex-final-publish-acceptance.sh'

permissions:
  contents: read

concurrency:
  group: cortex-final-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK / Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Unit and architecture gate
        run: |
          chmod +x ./gradlew 2>/dev/null || true
          gradle :app:testDebugUnitTest --stacktrace

      - name: Assemble app and instrumentation APKs
        run: gradle :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace

      - name: Full installed-runtime simulation on Android 35
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          heap-size: 768M
          disable-animations: true
          disk-size: 8G
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated -camera-front emulated
          script: sh .github/scripts/cortex-final-publish-acceptance.sh

      - name: Upload final publish simulation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cortex-final-publish-acceptance-${{ github.sha }}
          path: |
            publish-artifacts/
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: warn
          retention-days: 30
