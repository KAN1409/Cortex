name: Cortex Prime Update-In-Place APK

on:
  push:
    branches: ["prime/cortex-prime-v0"]
    paths:
      - ".github/workflows/prime-update-in-place-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Recover continuity signer outside workspace
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BLOB_SHA="3dd46c66dcc03599ba044655271f82202ec167a1"
          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs/${BLOB_SHA}" \
            | python3 -c 'import json,sys,base64; d=json.load(sys.stdin); sys.stdout.buffer.write(base64.b64decode(d["content"]))' \
            | base64 -d > /tmp/cortex-prime-continuity.p12
          chmod 600 /tmp/cortex-prime-continuity.p12

      - name: Verify continuity signer before build
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="5c6550a070abe477dcad5f23f3f437e183bff8aeaeb6ac52e1beaa8243ee69a7"
          ACTUAL=$(keytool -list -v -keystore /tmp/cortex-prime-continuity.p12 -storepass android -alias androiddebugkey 2>/dev/null \
            | awk -F': ' '/SHA256:/{gsub(":", "", $2); print tolower($2); exit}')
          test "$ACTUAL" = "$EXPECTED"
          echo "Continuity signer verified."

      - name: Test and build Cortex Prime
        env:
          CORTEX_PRIME_KEYSTORE: /tmp/cortex-prime-continuity.p12
          CORTEX_PRIME_STORE_PASSWORD: android
          CORTEX_PRIME_KEY_ALIAS: androiddebugkey
          CORTEX_PRIME_KEY_PASSWORD: android
        run: |
          gradle -p prime \
            :capture-relay:testDebugUnitTest \
            :capture-voice:testDebugUnitTest \
            :capture-vision:testDebugUnitTest \
            :local-intelligence:testDebugUnitTest \
            :app:assemblePrimePermanentDebug \
            --stacktrace

      - name: Verify APK identity, version and signer
        shell: bash
        run: |
          set -euo pipefail
          APK="prime/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          BADGING=$(aapt dump badging "$APK" | head -n1)
          echo "$BADGING"
          echo "$BADGING" | grep -q "name='com.kareem.cortex.prime'"
          VC=$(echo "$BADGING" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p")
          test -n "$VC"
          test "$VC" -gt 7
          EXPECTED="5c6550a070abe477dcad5f23f3f437e183bff8aeaeb6ac52e1beaa8243ee69a7"
          ACTUAL=$(apksigner verify --print-certs "$APK" | awk -F': ' '/Signer #1 certificate SHA-256 digest:/{print tolower($2); exit}')
          test "$ACTUAL" = "$EXPECTED"
          sha256sum "$APK" > Cortex-Prime-0.5.0.apk.sha256
          cp "$APK" Cortex-Prime-0.5.0.apk
          printf 'package=com.kareem.cortex.prime\nversionCode=%s\nversionName=0.5.0-perception-v1\nsignerSha256=%s\n' "$VC" "$ACTUAL" > Cortex-Prime-0.5.0-continuity.txt

      - name: Remove continuity signer
        if: always()
        run: rm -f /tmp/cortex-prime-continuity.p12

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: Cortex-Prime-0.5.0-update-in-place
          path: |
            Cortex-Prime-0.5.0.apk
            Cortex-Prime-0.5.0.apk.sha256
            Cortex-Prime-0.5.0-continuity.txt
          if-no-files-found: error
          retention-days: 30
