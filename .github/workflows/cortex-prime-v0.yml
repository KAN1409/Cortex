name: Cortex Prime V0

on:
  push:
    branches: ["prime/cortex-prime-v0"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v3
      - name: Install Android 35 SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Test capture modules and build Cortex Prime
        run: gradle -p prime :capture-relay:testDebugUnitTest :capture-voice:testDebugUnitTest :capture-vision:testDebugUnitTest :app:assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Cortex-Prime-0.1.3-vision-capture
          path: prime/app/build/outputs/apk/debug/app-debug.apk
