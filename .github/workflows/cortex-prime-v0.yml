name: Cortex Prime V0

on:
  push:
    branches: ["prime/cortex-prime-v0"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v3
      - name: Install Android 35 SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Test capture and intelligence modules, then build Cortex Prime
        run: gradle -p prime :capture-relay:testDebugUnitTest :capture-voice:testDebugUnitTest :capture-vision:testDebugUnitTest :local-intelligence:testDebugUnitTest :app:assembleDebug --stacktrace
      - name: Verify stable signer
        shell: bash
        run: |
          APK=prime/app/build/outputs/apk/debug/app-debug.apk
          EXPECTED=5c6550a070abe477dcad5f23f3f437e183bff8aeaeb6ac52e1beaa8243ee69a7
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -x "$APKSIGNER"
          ACTUAL=$("$APKSIGNER" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n1 | tr -d ':[:space:]' | tr 'A-F' 'a-f')
          echo "signer_sha256=$ACTUAL"
          test "$ACTUAL" = "$EXPECTED"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Cortex-Prime-0.4.0-now-normalizer-v2
          path: prime/app/build/outputs/apk/debug/app-debug.apk
