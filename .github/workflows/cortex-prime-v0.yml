name: Cortex Prime V0

on:
  push:
    branches: ["prime/cortex-prime-v0"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Build Cortex Prime
        run: ./gradlew -p prime :app:assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Cortex-Prime-0.1.0-foundation
          path: prime/app/build/outputs/apk/debug/app-debug.apk
