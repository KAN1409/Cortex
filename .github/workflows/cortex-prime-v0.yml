name: Cortex Prime V0

on:
  push:
    branches: ["prime/cortex-prime-v0"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v3
      - name: Install Android 35 SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Reject tracked signing secrets
        shell: bash
        run: |
          if git ls-files | grep -E '(^|/).*(\.keystore|\.jks|\.p12|keystore\.b64)$'; then
            echo "Signing key material must never be committed to the Cortex Prime branch."
            exit 1
          fi
      - name: Test capture and intelligence modules, then compile Cortex Prime
        run: gradle -p prime :capture-relay:testDebugUnitTest :capture-voice:testDebugUnitTest :capture-vision:testDebugUnitTest :local-intelligence:testDebugUnitTest :app:assembleDebug --stacktrace
      - name: CI artifact policy
        run: echo "CI APK is intentionally not published; installable Prime builds are signed only with the device-local permanent key."
