name: Cortex v146 Candidate Verify

on:
  push:
    branches:
      - audit/v146-fixes-candidate
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: cortex-v146-candidate-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Checkout candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Apply immutable workflow pins
        run: |
          python3 scripts/pin-github-actions.py
          git diff --check

      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '8.9'

      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Install Semgrep
        run: python3 -m pip install --disable-pip-version-check semgrep

      - name: Run full deterministic gate
        run: |
          chmod +x scripts/cortex-full-code-gate.sh scripts/cortex-repo-audit.sh
          scripts/cortex-full-code-gate.sh .

      - name: Commit verified workflow pins if needed
        run: |
          if git diff --quiet; then
            echo 'Candidate already fully pinned.'
            exit 0
          fi
          git config user.name 'cortex-audit-bot'
          git config user.email 'cortex-audit-bot@users.noreply.github.com'
          git add .github/workflows
          git diff --cached --check
          git commit -m 'security: pin v146 workflow dependencies [verified]'
          git push origin HEAD:audit/v146-fixes-candidate

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cortex-v146-candidate-${{ github.sha }}
          path: |
            audit/
            app/build/reports/lint-results-debug.*
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14
