name: Cortex Prime Signer Continuity Check

on:
  push:
    branches: ["prime/cortex-prime-v0"]
    paths:
      - ".github/workflows/prime-signer-continuity-check.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Recover historical debug keystore outside workspace
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BLOB_SHA="3dd46c66dcc03599ba044655271f82202ec167a1"
          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs/${BLOB_SHA}" \
            | python3 -c 'import json,sys,base64; d=json.load(sys.stdin); sys.stdout.buffer.write(base64.b64decode(d["content"]))' \
            | base64 -d > /tmp/cortex-historical-debug.p12
          chmod 600 /tmp/cortex-historical-debug.p12
      - name: Compare certificate SHA-256 only
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="5c6550a070abe477dcad5f23f3f437e183bff8aeaeb6ac52e1beaa8243ee69a7"
          ACTUAL=$(keytool -list -v -keystore /tmp/cortex-historical-debug.p12 -storepass android -alias androiddebugkey 2>/dev/null \
            | awk -F': ' '/SHA256:/{gsub(":", "", $2); print tolower($2); exit}')
          test -n "$ACTUAL"
          echo "historical_signer_sha256=$ACTUAL"
          if [ "$ACTUAL" = "$EXPECTED" ]; then
            echo "CORTEX_PRIME_0_4_SIGNER_MATCH=YES"
          else
            echo "CORTEX_PRIME_0_4_SIGNER_MATCH=NO"
            exit 2
          fi
      - name: Remove recovered keystore
        if: always()
        run: rm -f /tmp/cortex-historical-debug.p12
