name: Cortex Runner Smoke

on:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Runner baseline
        shell: bash
        run: |
          set -euxo pipefail
          echo "runner_alive=1"
          java -version
          git --version
          python3 --version
          uname -a
