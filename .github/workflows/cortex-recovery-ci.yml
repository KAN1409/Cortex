name: Cortex Recovery CI

on:
  push:
    branches: [ v2/cortex-recovery-zero-api ]
  pull_request:
    branches: [ main ]
    paths:
      - 'app/**'
      - '.github/workflows/cortex-recovery-ci.yml'
      - 'docs/CORTEX_RECOVERY_AUDIT.md'
      - 'docs/CORTEX_V2_RECOVERY_AUDIT.md'
      - 'docs/CORTEX_V2_ZERO_API_5G_ARCHITECTURE.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout Cortex recovery branch
        uses: actions/checkout@v6

      - name: Restore permanent Cortex update signing key
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          git show FETCH_HEAD:app/cortex-debug.keystore.b64 > app/cortex-debug.keystore.b64
          test -s app/cortex-debug.keystore.b64

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Assert recovered local ASR stack is present
        shell: bash
        run: |
          set -euo pipefail
          test -s app/libs/whisper-android-cortex-prompt-1.0.0.aar
          for f in \
            app/src/main/java/com/kareem/cortex/LocalAsrModelStore.java \
            app/src/main/java/com/kareem/cortex/MultilingualWhisperTranscriber.kt \
            app/src/main/java/com/kareem/cortex/CleanWhisperTranscriber.kt \
            app/src/main/java/com/kareem/cortex/AndroidOnDeviceAsrCandidate.java \
            app/src/main/java/com/kareem/cortex/GeminiNanoProbe.java \
            app/src/main/java/com/kareem/cortex/CodeSwitchCandidateSelector.java \
            app/src/main/java/com/kareem/cortex/WavSpeechChunker.java \
            app/src/main/java/com/kareem/cortex/WhisperGgmlModel.java \
            app/src/main/java/com/kareem/cortex/WhisperRuntimeState.java \
            app/src/main/java/com/kareem/cortex/CortexExecutionRouter.java; do
            test -s "$f"
          done
          grep -q "whisper-android-cortex-prompt-1.0.0.aar" app/build.gradle
          grep -q "genai-prompt:1.0.0-beta2" app/build.gradle

      - name: Protect the working voice-note baseline
        shell: bash
        run: |
          set -euo pipefail
          test -s app/src/main/java/com/kareem/cortex/CloudAudioTranscriber.java
          grep -q "CloudAudioTranscriber.transcribe" app/src/main/java/com/kareem/cortex/AudioAnalyzer.java
          grep -q "RATE=16000" app/src/main/java/com/kareem/cortex/AudioCapture.java
          grep -q "CHANNEL_IN_MONO" app/src/main/java/com/kareem/cortex/AudioCapture.java
          grep -q "ENCODING_PCM_16BIT" app/src/main/java/com/kareem/cortex/AudioCapture.java
          grep -q "ACCESS_NETWORK_STATE" app/src/main/AndroidManifest.xml

      - name: Prevent new paid inference integrations
        shell: bash
        run: |
          set -euo pipefail
          hits="$(grep -R -n -E 'api\.openai\.com|speech\.googleapis\.com|cognitiveservices\.azure\.com|OPENAI_API_KEY|AZURE_SPEECH_KEY|GOOGLE_SERVICE_ACCOUNT_JSON' app/src/main --exclude=CloudAudioTranscriber.java || true)"
          if [ -n "$hits" ]; then
            echo "$hits"
            echo 'New paid inference dependency detected in Android production source.' >&2
            exit 1
          fi
          ! grep -R -n -E 'CLOUD|PAID' app/src/main/java/com/kareem/cortex/CortexExecutionRouter.java

      - name: Unit and code-switch regression tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Android lint
        run: gradle :app:lintDebug --stacktrace

      - name: Build update-compatible debug and release APKs
        run: gradle :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Verify signed update APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Cortex-v1.1.0-v60-update.apk
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs dist/Cortex-v1.1.0-v60-update.apk > dist/signature.txt
          sha256sum dist/Cortex-v1.1.0-v60-update.apk > dist/Cortex-v1.1.0-v60-update.sha256

      - name: Upload recovery QA reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cortex-recovery-reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Cortex update APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cortex-v1.1.0-v60-update
          path: dist/
          if-no-files-found: error
          retention-days: 14
