name: Cortex Prime

on:
  push:
    paths:
      - 'prime/**'
      - '.github/workflows/prime-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cortex-prime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          # Save dependencies on this branch too, so Maven Central rate limits (429) can't fail every run.
          cache-read-only: false
      - name: Cache Robolectric runtime jars
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-android-all-4.14.1-sdk34
      - name: Model hashes (informational, pins ModelSpec)
        run: |
          curl -sf https://huggingface.co/api/models/ggerganov/whisper.cpp/tree/main | python3 -c "import sys,json; [print('MODEL', x['path'], x.get('size'), (x.get('lfs') or {}).get('oid')) for x in json.load(sys.stdin) if x['path'] in ('ggml-base-q5_1.bin','ggml-small-q5_1.bin','ggml-base.bin','ggml-small.bin')]" || echo "MODEL lookup failed"
      - name: Unit tests
        run: gradle -p prime :app:testDebugUnitTest --stacktrace --console=plain
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Cortex-Prime-test-reports
          path: |
            prime/app/build/reports/tests/testDebugUnitTest/**
            prime/app/build/test-results/testDebugUnitTest/**
          if-no-files-found: ignore
          retention-days: 5
      - name: Build debug APK
        run: gradle -p prime :app:assembleDebug --stacktrace --console=plain
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Cortex-Prime-debug
          path: prime/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
