name: Cortex Rebuild APK

on:
  push:
    branches:
      - rebuild/cortex-v1
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify Cortex 0.7.1 capture cognition policy
        shell: bash
        run: |
          set -euo pipefail
          grep -q "applicationId 'com.kareem.cortex.rebuild'" app/build.gradle
          grep -q "versionCode 8" app/build.gradle
          grep -q "versionName '0.7.1-capture-policy'" app/build.gradle
          grep -q 'TEST_META' app/src/main/java/com/kareem/cortex/rebuild/BrainIntakeEngine.java
          grep -q 'PRODUCT_FEEDBACK' app/src/main/java/com/kareem/cortex/rebuild/BrainIntakeEngine.java
          grep -q 'TRANSIENT' app/src/main/java/com/kareem/cortex/rebuild/BrainIntakeEngine.java
          grep -q 'CAPTURE_HISTORY_ONLY' app/src/main/java/com/kareem/cortex/rebuild/BrainIntakeEngine.java
          grep -q 'obviousCapturePolicy' app/src/main/java/com/kareem/cortex/rebuild/BrainIntakeEngine.java
          grep -q 'capture-policy-v1' app/src/main/java/com/kareem/cortex/rebuild/BrainIntakeEngine.java
          grep -q 'CREATE TABLE IF NOT EXISTS brain_evidence_policy' app/src/main/java/com/kareem/cortex/rebuild/BrainStore.java
          grep -q 'CREATE TABLE IF NOT EXISTS product_feedback' app/src/main/java/com/kareem/cortex/rebuild/BrainStore.java
          grep -q '72L\*60L\*60L\*1000L' app/src/main/java/com/kareem/cortex/rebuild/BrainStore.java
          grep -q 'purgeExpiredShortEvidence' app/src/main/java/com/kareem/cortex/rebuild/CortexApp.java
          grep -q 'BrainIntakeEngine.understand' app/src/main/java/com/kareem/cortex/rebuild/CaptureAnalysisQueue.java
          ! grep -q 'RECENT VOICE CAPTURES' app/src/main/java/com/kareem/cortex/rebuild/MainActivity.java
          ! grep -q 'recentVoiceOutcomes' app/src/main/java/com/kareem/cortex/rebuild/MainActivity.java
          grep -q 'CORTEX_SIGNER_BLOCKED_RUN53' scripts/finalize-cortex-0.7.1.sh
          grep -q 'pm install -r' scripts/finalize-cortex-0.7.1.sh
          grep -q '44b0180ba743460788171687f2dbcfb137c5e5a151f2783306747f84fbee39f4' scripts/prepare-cortex-rebuild-signer-recovery.sh
          grep -q 'CORTEX_REBUILD_CREDENTIALS_V1' tools/recovery/CortexCredentialBridge.java

      - name: Build debug and unsigned release APKs
        run: gradle :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Verify release artifact is unsigned
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n1)"
          test -n "$APKSIGNER"
          if "$APKSIGNER" verify "$APK" >/dev/null 2>&1; then
            echo "Release artifact unexpectedly carries a signer" >&2
            exit 1
          fi

      - name: Build UID-scoped credential recovery bridge
        shell: bash
        run: |
          set -euo pipefail
          ANDROID_JAR="$ANDROID_HOME/platforms/android-35/android.jar"
          test -s "$ANDROID_JAR"
          rm -rf build/recovery-classes dist/recovery-dex
          mkdir -p build/recovery-classes dist/recovery-dex
          javac -source 8 -target 8 -cp "$ANDROID_JAR" \
            -d build/recovery-classes tools/recovery/CortexCredentialBridge.java
          D8="$(find "$ANDROID_HOME/build-tools" -type f -name d8 | sort -V | tail -n1)"
          test -n "$D8"
          "$D8" --min-api 26 --lib "$ANDROID_JAR" --output dist/recovery-dex build/recovery-classes
          test -s dist/recovery-dex/classes.dex
          cp dist/recovery-dex/classes.dex dist/cortex-credential-bridge.dex

      - name: Package safe 0.7.1 finalizer
        shell: bash
        run: |
          set -euo pipefail
          OUT="dist/Cortex-0.7.1-Capture-Policy-finalizer"
          mkdir -p "$OUT"
          cp app/build/outputs/apk/release/app-release-unsigned.apk "$OUT/app-release-unsigned.apk"
          cp scripts/finalize-cortex-0.7.1.sh "$OUT/finalize-cortex-0.7.1.sh"
          chmod +x "$OUT/finalize-cortex-0.7.1.sh"
          cat > "$OUT/README.txt" <<'EOF'
          Cortex 0.7.1 capture-policy validation fix

          Package: com.kareem.cortex.rebuild
          versionCode: 8
          versionName: 0.7.1-capture-policy

          This package deliberately contains an unsigned APK.
          The finalizer first reads the signer of the currently installed Cortex, searches local and
          historical Cortex key material for the exact matching private key, and only then signs and
          attempts Android update-in-place. If no matching key exists, it exits without uninstalling,
          clearing, replacing, or mutating Cortex data.
          EOF
          (cd "$OUT" && sha256sum app-release-unsigned.apk finalize-cortex-0.7.1.sh > SHA256SUMS.txt)

      - name: Package signer recovery preparation
        shell: bash
        run: |
          set -euo pipefail
          OUT="dist/Cortex-Rebuild-Signer-Recovery"
          mkdir -p "$OUT"
          cp app/build/outputs/apk/release/app-release-unsigned.apk "$OUT/app-release-unsigned.apk"
          cp dist/cortex-credential-bridge.dex "$OUT/cortex-credential-bridge.dex"
          cp scripts/prepare-cortex-rebuild-signer-recovery.sh "$OUT/prepare-cortex-rebuild-signer-recovery.sh"
          chmod +x "$OUT/prepare-cortex-rebuild-signer-recovery.sh"
          cat > "$OUT/README.txt" <<'EOF'
          Cortex Rebuild signer recovery preparation

          This bundle is intentionally NON-DESTRUCTIVE.
          It is for the installed com.kareem.cortex.rebuild build whose CI run #53 signing key is
          unrecoverable. The script:
            - force-stops Cortex only long enough to create a consistent snapshot;
            - exports Gemini/Groq secrets through Android Keystore while the old UID still exists;
            - snapshots databases/shared_prefs/files and the installed APK into Termux private storage;
            - creates one new device-local permanent signer only if none exists;
            - signs Cortex 0.7.1 with that candidate permanent signer for a later cutover;
            - DOES NOT uninstall, clear, install, replace the package, or mutate the database.

          Run from Termux:
            bash prepare-cortex-rebuild-signer-recovery.sh
          EOF
          (cd "$OUT" && sha256sum app-release-unsigned.apk cortex-credential-bridge.dex prepare-cortex-rebuild-signer-recovery.sh > SHA256SUMS.txt)

      - name: Upload diagnostic debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Cortex-Rebuild-V1-Capture-Policy-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload safe finalizer
        uses: actions/upload-artifact@v4
        with:
          name: Cortex-0.7.1-Capture-Policy-finalizer
          path: dist/Cortex-0.7.1-Capture-Policy-finalizer/
          if-no-files-found: error

      - name: Upload signer recovery preparation
        uses: actions/upload-artifact@v4
        with:
          name: Cortex-Rebuild-Signer-Recovery
          path: dist/Cortex-Rebuild-Signer-Recovery/
          if-no-files-found: error
