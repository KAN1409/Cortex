name: Cortex Rebuild APK

on:
  push:
    branches:
      - rebuild/cortex-v1
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify fresh application identity
        run: |
          grep -q "applicationId 'com.kareem.cortex.rebuild'" app/build.gradle
          grep -q 'android:label="Cortex"' app/src/main/AndroidManifest.xml
          test ! -e app/src/main/java/com/kareem/cortex
      - name: Build first installable APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Cortex-Rebuild-V1-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
