name: Cortex Rebuild APK

on:
  push:
    branches:
      - rebuild/cortex-v1
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify Cortex 0.6 voice brain routing
        shell: bash
        run: |
          set -euo pipefail
          grep -q "applicationId 'com.kareem.cortex.rebuild'" app/build.gradle
          grep -q "versionName '0.6-voice-brain-routing'" app/build.gradle
          grep -q 'android:name=".CortexApp"' app/src/main/AndroidManifest.xml
          grep -q 'BrainIntakeEngine.understand' app/src/main/java/com/kareem/cortex/rebuild/CaptureAnalysisQueue.java
          grep -q 'BrainStore.ApplyResult brainResult' app/src/main/java/com/kareem/cortex/rebuild/CaptureAnalysisQueue.java
          grep -q 'RECENT VOICE CAPTURES' app/src/main/java/com/kareem/cortex/rebuild/MainActivity.java
          grep -q 'Cortex brain' app/src/main/java/com/kareem/cortex/rebuild/CaptureActivity.java
          grep -q 'brain_thinking' app/src/main/java/com/kareem/cortex/rebuild/BrainStore.java
          grep -q 'recoverPending' app/src/main/java/com/kareem/cortex/rebuild/CortexApp.java
      - name: Build Cortex 0.6 APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Cortex-Rebuild-V1-Voice-Brain-Routing-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
