name: Cortex Rebuild APK

on:
  push:
    branches:
      - rebuild/cortex-v1
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify Cortex 0.9.0 ChatGPT context bridge
        shell: bash
        run: |
          set -euo pipefail
          grep -q "applicationId 'com.kareem.cortex.rebuild'" app/build.gradle
          grep -q "versionCode 12" app/build.gradle
          grep -q "versionName '0.9.0-chatgpt-bridge'" app/build.gradle
          grep -q 'openai/gpt-oss-120b' app/src/main/java/com/kareem/cortex/rebuild/CortexBrainRouter.java
          grep -q 'SituationDecomposer.decompose' app/src/main/java/com/kareem/cortex/rebuild/BrainIntakeQueue.java
          grep -q 'replaceEvidenceSituations' app/src/main/java/com/kareem/cortex/rebuild/SituationActions.java
          grep -q 'Think with ChatGPT' app/src/main/java/com/kareem/cortex/rebuild/MainActivity.java
          grep -q 'ChatGptHandoff.showForQuestion' app/src/main/java/com/kareem/cortex/rebuild/MainActivity.java
          grep -q 'ChatGptHandoff.showForSituation' app/src/main/java/com/kareem/cortex/rebuild/SituationSheet.java
          grep -q 'Context to share with ChatGPT' app/src/main/java/com/kareem/cortex/rebuild/ChatGptHandoff.java
          grep -q 'ChatGPT prompt preview' app/src/main/java/com/kareem/cortex/rebuild/ChatGptHandoff.java
          grep -q 'Open in ChatGPT' app/src/main/java/com/kareem/cortex/rebuild/ChatGptHandoff.java
          grep -q 'com.openai.chatgpt' app/src/main/java/com/kareem/cortex/rebuild/ChatGptHandoff.java
          grep -q 'setMultiChoiceItems' app/src/main/java/com/kareem/cortex/rebuild/ChatGptHandoff.java
          grep -q 'TASK MODE:' app/src/main/java/com/kareem/cortex/rebuild/ChatGptHandoff.java
          grep -q 'VIDEO ANALYSIS' app/src/main/java/com/kareem/cortex/rebuild/ChatGptHandoff.java
          grep -q 'COMMUNICATION' app/src/main/java/com/kareem/cortex/rebuild/ChatGptHandoff.java
          grep -q 'DECIDE / PLAN' app/src/main/java/com/kareem/cortex/rebuild/ChatGptHandoff.java
          ! grep -q 'Ask Cortex about this' app/src/main/java/com/kareem/cortex/rebuild/SituationSheet.java
          ! grep -q 'title("Ask Cortex")' app/src/main/java/com/kareem/cortex/rebuild/MainActivity.java
          grep -q 'Edit transcription' app/src/main/java/com/kareem/cortex/rebuild/SituationSheet.java
          grep -q 'Listen original' app/src/main/java/com/kareem/cortex/rebuild/SituationSheet.java
          grep -q 'SeekBar' app/src/main/java/com/kareem/cortex/rebuild/SituationSheet.java
          grep -q 'status.setText("Stopped")' app/src/main/java/com/kareem/cortex/rebuild/SituationSheet.java
          grep -q 'Delete Situation' app/src/main/java/com/kareem/cortex/rebuild/SituationSheet.java
          grep -q 'Cortex-0.9.0-chatgpt-bridge-permanent.apk' scripts/devbridge-sign-stable-cortex-090.sh
          grep -q 'signer_generated=0' scripts/prepare-cortex-rebuild-signer-recovery.sh
          grep -q 'signer_replaced=0' scripts/prepare-cortex-rebuild-signer-recovery.sh
          ! grep -q 'openssl genpkey' scripts/prepare-cortex-rebuild-signer-recovery.sh
          ! grep -q 'keytool -genkey' scripts/prepare-cortex-rebuild-signer-recovery.sh

      - name: Build debug and unsigned release APKs
        run: gradle :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Verify release artifact is unsigned
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n1)"
          test -n "$APKSIGNER"
          if "$APKSIGNER" verify "$APK" >/dev/null 2>&1; then
            echo "Release artifact unexpectedly carries a signer" >&2
            exit 1
          fi

      - name: Upload Cortex 0.9.0 diagnostic debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Cortex-0.9.0-ChatGPT-Bridge-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Fetch verified DevBridge permanent APK when available
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin device/termux-dev-bridge-results
          ART='.devbridge/artifacts/Cortex-0.9.0-chatgpt-bridge-permanent.apk'
          SUM="$ART.sha256"
          if ! git cat-file -e "origin/device/termux-dev-bridge-results:$ART" 2>/dev/null; then
            echo 'HAS_PERMANENT=0' >> "$GITHUB_ENV"
            exit 0
          fi
          OUT="$RUNNER_TEMP/Cortex-0.9.0-chatgpt-bridge-permanent.apk"
          git show "origin/device/termux-dev-bridge-results:$ART" > "$OUT"
          git show "origin/device/termux-dev-bridge-results:$SUM" > "$RUNNER_TEMP/cortex090.sha256"
          test -s "$OUT"
          EXPECTED="$(awk '{print $1}' "$RUNNER_TEMP/cortex090.sha256" | head -n1)"
          ACTUAL="$(sha256sum "$OUT" | awk '{print $1}')"
          test -n "$EXPECTED" && test "$ACTUAL" = "$EXPECTED"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n1)"
          "$APKSIGNER" verify --print-certs "$OUT" > "$RUNNER_TEMP/cortex090-cert.txt"
          CERT="$(sed -n -E 's/^.*certificate SHA-256 digest:[[:space:]]*//p' "$RUNNER_TEMP/cortex090-cert.txt" | head -n1 | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          test "$CERT" = '5c6550a070abe477dcad5f23f3f437e183bff8aeaeb6ac52e1beaa8243ee69a7'
          echo "PERMANENT_APK=$OUT" >> "$GITHUB_ENV"
          echo 'HAS_PERMANENT=1' >> "$GITHUB_ENV"

      - name: Upload Cortex 0.9.0 permanent APK
        if: env.HAS_PERMANENT == '1'
        uses: actions/upload-artifact@v4
        with:
          name: Cortex-0.9.0-ChatGPT-Bridge-Permanent
          path: ${{ env.PERMANENT_APK }}
          if-no-files-found: error
