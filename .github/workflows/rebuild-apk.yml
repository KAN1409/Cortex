name: Cortex Rebuild APK

on:
  push:
    branches:
      - rebuild/cortex-v1
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify Cortex 0.8.1 Situation/source voice-player update
        shell: bash
        run: |
          set -euo pipefail
          grep -q "applicationId 'com.kareem.cortex.rebuild'" app/build.gradle
          grep -q "versionCode 11" app/build.gradle
          grep -q "versionName '0.8.1-voice-player'" app/build.gradle
          grep -q 'openai/gpt-oss-120b' app/src/main/java/com/kareem/cortex/rebuild/CortexBrainRouter.java
          grep -q 'openai/gpt-oss-120b' app/src/main/java/com/kareem/cortex/rebuild/SituationDecomposer.java
          grep -q 'SituationDecomposer.decompose' app/src/main/java/com/kareem/cortex/rebuild/BrainIntakeQueue.java
          grep -q 'replaceEvidenceSituations' app/src/main/java/com/kareem/cortex/rebuild/SituationActions.java
          grep -q 'Edit transcription' app/src/main/java/com/kareem/cortex/rebuild/SituationSheet.java
          grep -q 'Listen original' app/src/main/java/com/kareem/cortex/rebuild/SituationSheet.java
          grep -q 'SeekBar' app/src/main/java/com/kareem/cortex/rebuild/SituationSheet.java
          grep -q 'player.pause()' app/src/main/java/com/kareem/cortex/rebuild/SituationSheet.java
          grep -q 'status.setText("Stopped")' app/src/main/java/com/kareem/cortex/rebuild/SituationSheet.java
          grep -q 'dialog.setOnDismissListener' app/src/main/java/com/kareem/cortex/rebuild/SituationSheet.java
          grep -q 'Delete Situation' app/src/main/java/com/kareem/cortex/rebuild/SituationSheet.java
          grep -q 'Split / re-run Brain' app/src/main/java/com/kareem/cortex/rebuild/SituationSheet.java
          grep -q 'Merge with' app/src/main/java/com/kareem/cortex/rebuild/SituationSheet.java
          grep -q 'Keep in Memory' app/src/main/java/com/kareem/cortex/rebuild/SituationSheet.java
          grep -q 'Delete source capture' app/src/main/java/com/kareem/cortex/rebuild/SituationSheet.java
          grep -q 'r.jina.ai' app/src/main/java/com/kareem/cortex/rebuild/WebSummaryEngine.java
          grep -q 'Summarize linked page / video' app/src/main/java/com/kareem/cortex/rebuild/MainActivity.java
          grep -q 'SituationSheet.show' app/src/main/java/com/kareem/cortex/rebuild/MainActivity.java
          grep -q 'Linkify.WEB_URLS' app/src/main/java/com/kareem/cortex/rebuild/MainActivity.java
          grep -q 'Cortex-0.8.1-voice-player-permanent.apk' scripts/devbridge-sign-stable-cortex-081.sh
          grep -q 'signer_generated=0' scripts/prepare-cortex-rebuild-signer-recovery.sh
          grep -q 'signer_replaced=0' scripts/prepare-cortex-rebuild-signer-recovery.sh
          ! grep -q 'openssl genpkey' scripts/prepare-cortex-rebuild-signer-recovery.sh
          ! grep -q 'keytool -genkey' scripts/prepare-cortex-rebuild-signer-recovery.sh

      - name: Build debug and unsigned release APKs
        run: gradle :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Verify release artifact is unsigned
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n1)"
          test -n "$APKSIGNER"
          if "$APKSIGNER" verify "$APK" >/dev/null 2>&1; then
            echo "Release artifact unexpectedly carries a signer" >&2
            exit 1
          fi

      - name: Upload Cortex 0.8.1 diagnostic debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Cortex-0.8.1-Voice-Player-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
