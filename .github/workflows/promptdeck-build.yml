name: PromptDeck APK Build

on:
  push:
    branches: [ "promptdeck-build-v0.2.0" ]
    paths:
      - "promptdeck-build/**"
      - ".github/workflows/promptdeck-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild source archive
        run: |
          cat promptdeck-build/chunks/* > /tmp/PromptDeck.b64
          base64 -d /tmp/PromptDeck.b64 > /tmp/PromptDeck.zip
          mkdir -p /tmp/pd
          unzip -o /tmp/PromptDeck.zip -d /tmp/pd || true
          test -f /tmp/pd/PromptDeck/app/build.gradle
          cp promptdeck-build/MainActivity.java /tmp/pd/PromptDeck/app/src/main/java/com/kareem/promptdeck/MainActivity.java
          python3 promptdeck-build/patch-ui-rc2.py
          python3 promptdeck-build/patch-ui-rc3.py
          python3 promptdeck-build/patch-ui-rc4.py
          python3 promptdeck-build/patch-ui-rc5-github.py
          python3 promptdeck-build/patch-ui-rc6-photo.py
          python3 promptdeck-build/patch-ui-rc9-extra-photo-codes.py
          python3 promptdeck-build/patch-ui-rc10-satin-nav.py
          python3 promptdeck-build/patch-ui-rc11-safe-area.py
          python3 promptdeck-build/patch-ui-rc12-english-brand.py
          sed -i 's/((ClipboardManager)/((android.content.ClipboardManager)/' /tmp/pd/PromptDeck/app/src/main/java/com/kareem/promptdeck/MainActivity.java
          sed -Ei 's/versionCode[[:space:]]+[0-9]+/versionCode 16/' /tmp/pd/PromptDeck/app/build.gradle || true
          sed -Ei "s/versionName[[:space:]]+['\"][^'\"]+['\"]/versionName '0.6.1'/" /tmp/pd/PromptDeck/app/build.gradle || true
          echo "Build metadata:"
          grep -E 'version(Code|Name)' /tmp/pd/PromptDeck/app/build.gradle || true
          echo "Brand/icon sanity:"
          grep -n 'promptdeck_icon\|englishizeDescriptions\|ACCENT=Color.rgb(47,107,255)' /tmp/pd/PromptDeck/app/src/main/java/com/kareem/promptdeck/MainActivity.java /tmp/pd/PromptDeck/app/src/main/AndroidManifest.xml | head -20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        working-directory: /tmp/pd/PromptDeck
        run: gradle --no-daemon assembleDebug

      - name: Verify APK
        run: |
          APK=/tmp/pd/PromptDeck/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -20
          sha256sum "$APK" | tee /tmp/PromptDeck-v0.6.1-rc12.sha256
          cp "$APK" /tmp/PromptDeck-v0.6.1-rc12.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PromptDeck-v0.6.1-rc12-build
          path: |
            /tmp/PromptDeck-v0.6.1-rc12.apk
            /tmp/PromptDeck-v0.6.1-rc12.sha256
          if-no-files-found: error
