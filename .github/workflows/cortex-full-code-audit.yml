name: Cortex Full Code Audit

on:
  push:
    branches:
      - audit/full-code-fix-v145
  workflow_dispatch:

permissions:
  contents: write
  security-events: write
  actions: read

concurrency:
  group: cortex-full-code-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mechanical-repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      candidate_sha: ${{ steps.candidate.outputs.sha }}
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: audit/full-code-fix-v145

      - name: Apply evidence-backed mechanical repairs
        run: |
          python3 scripts/cortex-mechanical-repair.py
          git diff --check

      - name: Commit repair batch when needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'Mechanical repair is already fully applied.'
            exit 0
          fi
          git config user.name 'cortex-audit-bot'
          git config user.email 'cortex-audit-bot@users.noreply.github.com'
          git add app/src scripts/cortex-full-code-gate.sh scripts/cortex-repo-audit.sh
          git diff --cached --check
          git commit -m 'fix: apply deterministic Android lint repairs [mechanical-fix]'
          git push origin HEAD:audit/full-code-fix-v145

      - name: Publish exact repaired candidate SHA
        id: candidate
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  deterministic-audit:
    needs: mechanical-repair
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Checkout exact repaired candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.mechanical-repair.outputs.candidate_sha }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Semgrep
        run: python3 -m pip install --disable-pip-version-check semgrep

      - name: Run full deterministic code gate
        shell: bash
        run: |
          chmod +x scripts/cortex-full-code-gate.sh scripts/cortex-repo-audit.sh
          scripts/cortex-full-code-gate.sh .

      - name: Upload complete deterministic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cortex-full-code-audit-${{ needs.mechanical-repair.outputs.candidate_sha }}
          path: |
            audit/
            app/build/reports/lint-results-debug.*
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14

  codeql:
    needs: mechanical-repair
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Checkout exact repaired candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.mechanical-repair.outputs.candidate_sha }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Initialize CodeQL for Java and Kotlin
        uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin
          queries: security-extended,security-and-quality

      - name: Compile without packaging an APK
        run: gradle :app:compileDebugJavaWithJavac :app:compileDebugKotlin --stacktrace

      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:java-kotlin

  gemini-repair:
    needs: [mechanical-repair, deterministic-audit]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_CLI_TRUST_WORKSPACE: 'true'
    steps:
      - name: Checkout exact repaired candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.mechanical-repair.outputs.candidate_sha }}

      - name: Detect Gemini free API credential
        id: gemini_key
        shell: bash
        run: |
          if [ -n "${GEMINI_API_KEY:-}" ]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
            echo 'Gemini credential available.'
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo 'GEMINI_API_KEY is not configured; deterministic and CodeQL scans still run.'
          fi

      - name: Set up Java 17
        if: steps.gemini_key.outputs.available == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        if: steps.gemini_key.outputs.available == 'true'
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.9
        if: steps.gemini_key.outputs.available == 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Node 22
        if: steps.gemini_key.outputs.available == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Gemini CLI and Semgrep
        if: steps.gemini_key.outputs.available == 'true'
        run: |
          npm install -g @google/gemini-cli
          python3 -m pip install --disable-pip-version-check semgrep
          gemini --version
          semgrep --version

      - name: Bounded semantic review and repair loop
        if: steps.gemini_key.outputs.available == 'true'
        shell: bash
        run: |
          set -uo pipefail
          chmod +x scripts/cortex-full-code-gate.sh scripts/cortex-repo-audit.sh
          mkdir -p audit

          previous_state=''
          green=0
          for round in 1 2 3; do
            echo "===== PRE-REPAIR GATES ROUND ${round} ====="
            set +e
            scripts/cortex-full-code-gate.sh .
            gate_rc=$?
            set -e

            if [ "$gate_rc" -eq 0 ]; then
              echo 'Deterministic gates are green; running semantic whole-repo review before acceptance.'
            fi

            prompt="Read GEMINI.md and obey it exactly. This is bounded repair round ${round}/3. Read audit/manifest.tsv and the audit logs generated by scripts/cortex-full-code-gate.sh. Perform a semantic review of the tracked code/config surface, prioritizing real correctness, crash, data-integrity, lifecycle, concurrency, security, resource, Android, database, parsing and bridge defects. Fix only evidence-supported defects. Do not commit, push, merge, change package/signing/version identity, build an APK, weaken tests, add blanket suppressions, or fabricate evidence. Re-run focused checks as useful. Leave all safe repairs in the working tree."
            gemini --yolo --output-format text -p "$prompt" | tee "audit/gemini-round-${round}.log"

            git diff --check
            state="$(git diff --binary | sha256sum | awk '{print $1}')"
            if [ "$state" = "$previous_state" ]; then
              echo "LOOP_GUARD: no new diff state in round ${round}; stopping repair loop."
              break
            fi
            previous_state="$state"

            echo "===== POST-REPAIR GATES ROUND ${round} ====="
            set +e
            scripts/cortex-full-code-gate.sh .
            post_rc=$?
            set -e
            if [ "$post_rc" -eq 0 ]; then
              green=1
              break
            fi
          done

          if [ "$green" -ne 1 ]; then
            echo 'Gemini repair loop exhausted or stalled before all deterministic gates became green.' >&2
            git diff --stat || true
            git diff > audit/unaccepted-repair.patch || true
            exit 2
          fi

          if git diff --quiet; then
            echo 'All gates green and Gemini made no source changes.'
            exit 0
          fi

          git config user.name 'cortex-audit-bot'
          git config user.email 'cortex-audit-bot@users.noreply.github.com'
          git add -A -- . ':(exclude)audit'
          git diff --cached --check
          git commit -m 'fix: full code audit repairs [gemini-fix]'
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Upload Gemini audit evidence
        if: always() && steps.gemini_key.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cortex-gemini-repair-${{ needs.mechanical-repair.outputs.candidate_sha }}
          path: audit/
          if-no-files-found: warn
          retention-days: 14
