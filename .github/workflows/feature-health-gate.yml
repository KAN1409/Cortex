name: Health Follow-up Branch Gate

on:
  push:
    branches: [ feature/health-followup ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: health-followup-branch-gate
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact branch commit
        uses: actions/checkout@v4

      - name: Run repository audit
        run: bash scripts/cortex-repo-audit.sh "$GITHUB_WORKSPACE"

      - name: Run Health Follow-up contract audit
        run: bash scripts/cortex-health-followup-audit.sh "$GITHUB_WORKSPACE"

      - name: Run Context Core contract audit
        run: bash scripts/cortex-context-core-audit.sh "$GITHUB_WORKSPACE"

      - name: Run goal-driven user-journey contract audit
        run: bash scripts/cortex-user-journey-audit.sh "$GITHUB_WORKSPACE"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compile debug APK without publishing artifact
        run: gradle :app:assembleDebug --stacktrace --console=plain
