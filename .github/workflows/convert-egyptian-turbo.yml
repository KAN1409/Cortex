name: Convert Egyptian Whisper Turbo to GGML Q8

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/convert-egyptian-turbo.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  convert-model:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout Cortex
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install conversion dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.8.0
          python -m pip install 'transformers>=4.46,<5' 'huggingface_hub>=0.28' safetensors numpy

      - name: Download fine-tuned Egyptian code-switch model
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from huggingface_hub import snapshot_download, hf_hub_download
          import os, shutil

          model_id = 'mohammedaly22/whisper-large-v3-turbo-egyptian-code-switching'
          base_id = 'openai/whisper-large-v3-turbo'
          out = os.path.abspath('hf-model')

          snapshot_download(
              repo_id=model_id,
              local_dir=out,
              allow_patterns=[
                  'model.safetensors',
                  'config.json',
                  'generation_config.json',
                  'processor_config.json',
                  'tokenizer.json',
                  'tokenizer_config.json',
              ],
          )

          # whisper.cpp's HF converter currently requires the legacy vocab files.
          for name in ['vocab.json', 'added_tokens.json', 'merges.txt']:
              src = hf_hub_download(repo_id=base_id, filename=name)
              shutil.copy2(src, os.path.join(out, name))
          PY
          echo '50a9a1cba2ca8c4889b2cc4fcfb7b6b294aecc4d900868da5a462923ff420364  hf-model/model.safetensors' | sha256sum -c -
          du -sh hf-model

      - name: Clone whisper.cpp and OpenAI Whisper assets
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/ggml-org/whisper.cpp.git whisper.cpp
          git clone --depth 1 https://github.com/openai/whisper.git openai-whisper

      - name: Convert Hugging Face model to GGML F16
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p converted
          python whisper.cpp/models/convert-h5-to-ggml.py hf-model openai-whisper converted
          test -s converted/ggml-model.bin
          python - <<'PY'
          from pathlib import Path
          p = Path('converted/ggml-model.bin')
          with p.open('rb') as f:
              assert f.read(4) == b'lmgg', 'Unexpected GGML magic'
          print('GGML F16 bytes:', p.stat().st_size)
          PY

      - name: Build whisper.cpp quantizer
        shell: bash
        run: |
          set -euo pipefail
          cmake -S whisper.cpp -B whisper.cpp/build -DCMAKE_BUILD_TYPE=Release
          cmake --build whisper.cpp/build --config Release -j2 --target whisper-quantize

      - name: Quantize to Q8_0
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          whisper.cpp/build/bin/whisper-quantize \
            converted/ggml-model.bin \
            dist/ggml-egyptian-large-v3-turbo-q8_0.bin \
            q8_0
          test -s dist/ggml-egyptian-large-v3-turbo-q8_0.bin
          python - <<'PY'
          from pathlib import Path
          p = Path('dist/ggml-egyptian-large-v3-turbo-q8_0.bin')
          with p.open('rb') as f:
              assert f.read(4) == b'lmgg', 'Unexpected GGML magic after quantization'
          print('Q8_0 bytes:', p.stat().st_size)
          PY
          sha256sum dist/ggml-egyptian-large-v3-turbo-q8_0.bin > dist/ggml-egyptian-large-v3-turbo-q8_0.sha256
          cat dist/ggml-egyptian-large-v3-turbo-q8_0.sha256

      - name: Upload Cortex-ready model
        uses: actions/upload-artifact@v4
        with:
          name: Cortex-Egyptian-Large-V3-Turbo-Q8_0
          path: dist/
          compression-level: 0
          if-no-files-found: error
          retention-days: 30
