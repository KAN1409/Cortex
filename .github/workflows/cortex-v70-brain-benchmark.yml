name: Cortex v70 Brain Benchmark

on:
  push:
    branches: [ v70/cognitive-core-benchmark ]
  workflow_dispatch:

jobs:
  brain-benchmark:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout benchmark branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 20

      - name: Restore local Whisper runtime AAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/libs
          git fetch origin v2/cortex-recovery-zero-api --depth=1
          git show FETCH_HEAD:app/libs/whisper-android-cortex-prompt-1.0.0.aar > app/libs/whisper-android-cortex-prompt-1.0.0.aar
          test -s app/libs/whisper-android-cortex-prompt-1.0.0.aar

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Preserve v69 acceptance gates and run v70 brain benchmark
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Verify v69 gates remain green
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          p='app/build/test-results/testDebugUnitTest/TEST-com.kareem.cortex.StatefulMeaningAcceptanceTest.xml'
          root=ET.parse(p).getroot()
          cases=[x for x in root.findall('testcase') if x.attrib.get('name','').startswith('gate')]
          bad=[c.attrib.get('name') for c in cases if c.find('failure') is not None or c.find('error') is not None or c.find('skipped') is not None]
          assert len(cases)==35, f'expected 35 inherited gates, found {len(cases)}'
          assert not bad, 'failed/skipped inherited gates: '+','.join(bad)
          print('Inherited v69 acceptance: 35/35 PASS')
          PY

      - name: Verify v70 cognitive suites
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          checks={
            'AttentionDecisionEngineTest':12,
            'CognitiveWorldStateTest':9,
            'AttentionShadowComparatorTest':2,
            'CognitiveShadowStoreTest':2,
            'CognitiveBrainStressTest':16,
            'ColdStartQuarantineTest':3,
          }
          total=0
          for cls,minimum in checks.items():
              p=f'app/build/test-results/testDebugUnitTest/TEST-com.kareem.cortex.{cls}.xml'
              root=ET.parse(p).getroot()
              cases=root.findall('testcase')
              bad=[c.attrib.get('name') for c in cases if c.find('failure') is not None or c.find('error') is not None or c.find('skipped') is not None]
              assert len(cases)>=minimum, f'{cls}: expected at least {minimum}, found {len(cases)}'
              assert not bad, f'{cls}: failed/skipped '+','.join(bad)
              total += len(cases)
              print(f'{cls}: {len(cases)}/{len(cases)} PASS')
          assert total >= 44
          print(f'v70 cognitive/recovery suites: {total}/{total} PASS')
          PY
          grep -q 'CognitiveShadowStore.run' app/src/main/java/com/kareem/cortex/StatefulMeaningWorker.java
          ! grep -q 'ue_attention_items.*INSERT\|INSERT.*ue_attention_items' app/src/main/java/com/kareem/cortex/CognitiveShadowStore.java
          ! grep -q 'ue_projection_decisions.*INSERT\|INSERT.*ue_projection_decisions' app/src/main/java/com/kareem/cortex/CognitiveShadowStore.java

      - name: Build installable debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify cold-start quarantine in merged manifest
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'private static final boolean ACTIVE = true' app/src/main/java/com/kareem/cortex/StartupSafetyGate.java
          grep -q 'if(!StartupSafetyGate.active())' app/src/main/java/com/kareem/cortex/InputActivity.java
          grep -q 'tools:node="remove"' app/src/main/AndroidManifest.xml
          found=0
          while IFS= read -r manifest; do
            found=1
            if grep -q 'androidx.work.WorkManagerInitializer' "$manifest"; then
              echo "WorkManagerInitializer survived manifest merge: $manifest" >&2
              exit 1
            fi
          done < <(find app/build/intermediates -type f -name AndroidManifest.xml -path '*merged_manifest*' -o -type f -name AndroidManifest.xml -path '*merged_manifests*')
          test "$found" = 1
          echo 'Cold-start quarantine: WorkManager auto-init absent from merged debug manifest'

      - name: Run full Android lint diagnostic
        id: lint
        continue-on-error: true
        run: gradle :app:lintDebug --stacktrace

      - name: Gate cognitive code and crash-risk lint regressions
        shell: bash
        run: |
          set -euo pipefail
          XML=app/build/reports/lint-results-debug.xml
          test -s "$XML"
          python3 - <<'PY'
          import os, xml.etree.ElementTree as ET
          p='app/build/reports/lint-results-debug.xml'
          root=ET.parse(p).getroot()
          errors=[i for i in root.findall('issue') if i.attrib.get('severity')=='Error']
          brain_names={
              'AttentionDecisionEngine.java','CognitiveWorldState.java','CognitiveShadowStore.java',
              'AttentionShadowComparator.java','StatefulMeaningWorker.java','CognitiveBrainStressTest.java',
              'StartupSafetyGate.java','ColdStartQuarantineTest.java'
          }
          brain=[]
          crash=[]
          for i in errors:
              loc=i.find('location')
              f=os.path.basename(loc.attrib.get('file','')) if loc is not None else ''
              if f in brain_names: brain.append((i.attrib.get('id'),f,i.attrib.get('message')))
              if i.attrib.get('id') in {'MissingPermission','UnsafeOptInUsageError','NewApi'}:
                  crash.append((i.attrib.get('id'),f,i.attrib.get('message')))
          print(f'Full-project lint debt: {len(errors)} errors')
          assert len(errors) <= 26, f'lint error count regressed: {len(errors)} > known post-fix ceiling 26'
          assert not brain, 'cognitive/recovery v70 lint errors: '+repr(brain)
          assert not crash, 'runtime/crash-risk lint errors remain: '+repr(crash)
          print('Cognitive/recovery lint gate: PASS; no v70 brain or startup-quarantine errors')
          PY

      - name: Repeat brain tests from scratch for determinism
        run: gradle :app:testDebugUnitTest --rerun-tasks --stacktrace

      - name: Verify second pass stayed green
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          files=glob.glob('app/build/test-results/testDebugUnitTest/TEST-*.xml')
          assert files, 'no unit test XML files after repeatability pass'
          total=0
          bad=[]
          for p in files:
              root=ET.parse(p).getroot()
              cases=root.findall('testcase')
              total += len(cases)
              for c in cases:
                  if c.find('failure') is not None or c.find('error') is not None or c.find('skipped') is not None:
                      bad.append(p.split('/')[-1]+':'+c.attrib.get('name','?'))
          assert total >= 73, f'expected broad repeated suite, only {total} cases found'
          assert not bad, 'repeatability failures/skips: '+','.join(bad)
          print(f'Repeatability pass: {total}/{total} tests PASS')
          PY

      - name: Upload benchmark reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cortex-v70-brain-benchmark-qa
          path: |
            app/build/test-results/
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
            app/build/outputs/apk/debug/
            app/build/intermediates/merged_manifests/
            docs/CORTEX_BRAIN_BENCHMARK_V1.md
          if-no-files-found: warn
          retention-days: 14
