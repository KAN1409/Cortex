name: Cortex v70 Brain Benchmark

on:
  push:
    branches: [ v70/cognitive-core-benchmark ]
  workflow_dispatch:

jobs:
  brain-benchmark:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout benchmark branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 50

      - name: Restore local Whisper runtime AAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/libs
          git fetch origin v2/cortex-recovery-zero-api --depth=1
          git show FETCH_HEAD:app/libs/whisper-android-cortex-prompt-1.0.0.aar > app/libs/whisper-android-cortex-prompt-1.0.0.aar
          test -s app/libs/whisper-android-cortex-prompt-1.0.0.aar

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Full repository startup-risk audit
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/startup-crash-audit.sh
          scripts/startup-crash-audit.sh .

      - name: Preserve v69 acceptance gates and run v70 brain benchmark
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Verify v69 gates remain green
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          p='app/build/test-results/testDebugUnitTest/TEST-com.kareem.cortex.StatefulMeaningAcceptanceTest.xml'
          root=ET.parse(p).getroot()
          cases=[x for x in root.findall('testcase') if x.attrib.get('name','').startswith('gate')]
          bad=[c.attrib.get('name') for c in cases if c.find('failure') is not None or c.find('error') is not None or c.find('skipped') is not None]
          assert len(cases)==35, f'expected 35 inherited gates, found {len(cases)}'
          assert not bad, 'failed/skipped inherited gates: '+','.join(bad)
          print('Inherited v69 acceptance: 35/35 PASS')
          PY

      - name: Verify v70 cognitive and staged recovery suites
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          checks={
            'AttentionDecisionEngineTest':16,
            'CognitiveWorldStateTest':12,
            'AttentionShadowComparatorTest':2,
            'CognitiveShadowStoreTest':4,
            'AttentionTraceExporterTest':3,
            'CognitiveBrainStressTest':16,
            'ColdStartQuarantineTest':4,
            'CapabilitySupervisorTest':7,
          }
          total=0
          for cls,minimum in checks.items():
              p=f'app/build/test-results/testDebugUnitTest/TEST-com.kareem.cortex.{cls}.xml'
              root=ET.parse(p).getroot()
              cases=root.findall('testcase')
              bad=[c.attrib.get('name') for c in cases if c.find('failure') is not None or c.find('error') is not None or c.find('skipped') is not None]
              assert len(cases)>=minimum, f'{cls}: expected at least {minimum}, found {len(cases)}'
              assert not bad, f'{cls}: failed/skipped '+','.join(bad)
              total += len(cases)
              print(f'{cls}: {len(cases)}/{len(cases)} PASS')
          assert total >= 64
          print(f'v70 cognitive/staged-recovery/temporal-attention suites: {total}/{total} PASS')
          PY
          grep -q 'CognitiveShadowStore.run' app/src/main/java/com/kareem/cortex/StatefulMeaningWorker.java
          grep -q 'new CognitiveWorldState' app/src/main/java/com/kareem/cortex/CognitiveShadowStore.java
          grep -q 'world.attentionCandidates' app/src/main/java/com/kareem/cortex/CognitiveShadowStore.java
          grep -q 'cognitive_eligible' app/src/main/java/com/kareem/cortex/CognitiveShadowStore.java
          grep -q 'candidate_last_seen_at' app/src/main/java/com/kareem/cortex/CognitiveShadowStore.java
          grep -q 'cognitive_freshness' app/src/main/java/com/kareem/cortex/CognitiveShadowStore.java
          grep -q 'freshnessScore' app/src/main/java/com/kareem/cortex/AttentionDecisionEngine.java
          grep -q 's.lastSeenAt' app/src/main/java/com/kareem/cortex/CognitiveWorldState.java
          grep -q 'cognitive_funnel' app/src/main/java/com/kareem/cortex/AttentionTraceExporter.java
          grep -q 'peakRisk' app/src/main/java/com/kareem/cortex/CognitiveWorldState.java
          grep -q 'if (!newer) return s' app/src/main/java/com/kareem/cortex/CognitiveWorldState.java
          grep -q 's.risk = o.risk' app/src/main/java/com/kareem/cortex/CognitiveWorldState.java
          ! grep -q 'ue_attention_items.*INSERT\|INSERT.*ue_attention_items' app/src/main/java/com/kareem/cortex/CognitiveShadowStore.java
          ! grep -q 'ue_projection_decisions.*INSERT\|INSERT.*ue_projection_decisions' app/src/main/java/com/kareem/cortex/CognitiveShadowStore.java
          grep -q 'SafeCoreLifecycle.install(this)' app/src/main/java/com/kareem/cortex/CortexApp.java
          grep -q 'CapabilitySupervisor.Capability.RAW_NOTIFICATION_CAPTURE' app/src/main/java/com/kareem/cortex/NotificationCaptureService.java
          grep -q 'CapabilitySupervisor.Capability.LOCAL_LLM_NATIVE' app/src/main/java/com/kareem/cortex/UniversalSemanticScheduler.java
          grep -q 'CapabilitySupervisor.Capability.OCR_NATIVE' app/src/main/java/com/kareem/cortex/OcrAnalyzer.java
          grep -q 'CapabilitySupervisor.Capability.OCR_NATIVE' app/src/main/java/com/kareem/cortex/ArabicOcr.java
          grep -q 'CapabilitySupervisor.Capability.ASR_NATIVE' app/src/main/java/com/kareem/cortex/CleanWhisperTranscriber.kt
          grep -q 'requireNativeAllowed()' app/src/main/java/com/kareem/cortex/LocalLlmBridge.kt

      - name: Build installable debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify provider-first WorkManager bootstrap and staged recovery
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'private static final boolean ACTIVE = true' app/src/main/java/com/kareem/cortex/StartupSafetyGate.java
          grep -q 'if(!StartupSafetyGate.active())' app/src/main/java/com/kareem/cortex/InputActivity.java
          grep -q 'SafeCoreLifecycle.install(this)' app/src/main/java/com/kareem/cortex/CortexApp.java
          grep -q 'POST_RESUME_SETTLE_MS' app/src/main/java/com/kareem/cortex/SafeCoreRuntime.java
          grep -q 'SELECT 1' app/src/main/java/com/kareem/cortex/SafeCoreRuntime.java
          grep -q 'CapabilitySupervisor.Capability.LOCAL_LLM_NATIVE' app/src/main/java/com/kareem/cortex/UniversalSemanticScheduler.java
          grep -q 'CapabilitySupervisor.Capability.OCR_NATIVE' app/src/main/java/com/kareem/cortex/OcrAnalyzer.java
          grep -q 'CapabilitySupervisor.Capability.ASR_NATIVE' app/src/main/java/com/kareem/cortex/CleanWhisperTranscriber.kt
          grep -q 'StartupSafetyGate.active()' app/src/main/java/com/kareem/cortex/LocalLlmBridge.kt
          ! grep -q 'androidx.work.WorkManagerInitializer' app/src/main/AndroidManifest.xml
          ! grep -q 'Configuration.Provider' app/src/main/java/com/kareem/cortex/CortexApp.java
          ! grep -q 'WorkManager.initialize' app/src/main/java/com/kareem/cortex/CortexApp.java
          found=0
          init=0
          while IFS= read -r manifest; do
            found=1
            grep -q 'android:name="com.kareem.cortex.CortexApp"\|android:name=".CortexApp"' "$manifest" || true
            if grep -q 'androidx.work.WorkManagerInitializer' "$manifest"; then init=1; fi
          done < <(find app/build/intermediates -type f -name AndroidManifest.xml \( -path '*merged_manifest*' -o -path '*merged_manifests*' \) | sort)
          test "$found" = 1
          test "$init" = 1
          echo 'WorkManager bootstrap: default AndroidX Startup initializer PRESENT; staged safe-core + native quarantine contracts PRESENT'

      - name: Re-run exhaustive startup audit against merged manifest
        shell: bash
        run: |
          set -euo pipefail
          scripts/startup-crash-audit.sh .

      - name: Run full Android lint diagnostic
        id: lint
        continue-on-error: true
        run: gradle :app:lintDebug --stacktrace

      - name: Gate cognitive code and crash-risk lint regressions
        shell: bash
        run: |
          set -euo pipefail
          XML=app/build/reports/lint-results-debug.xml
          test -s "$XML"
          python3 - <<'PY'
          import os, xml.etree.ElementTree as ET
          p='app/build/reports/lint-results-debug.xml'
          root=ET.parse(p).getroot()
          errors=[i for i in root.findall('issue') if i.attrib.get('severity')=='Error']
          brain_names={
              'AttentionDecisionEngine.java','CognitiveWorldState.java','CognitiveShadowStore.java',
              'AttentionShadowComparator.java','AttentionTraceExporter.java','StatefulMeaningWorker.java','StatefulMeaningScheduler.java',
              'CognitiveBrainStressTest.java','StartupSafetyGate.java','ColdStartQuarantineTest.java',
              'CapabilitySupervisor.java','CapabilitySupervisorTest.java','SafeCoreRuntime.java',
              'SafeCoreLifecycle.java','NotificationCaptureService.java','UniversalSemanticScheduler.java',
              'OcrAnalyzer.java','ArabicOcr.java','CleanWhisperTranscriber.kt','LocalLlmBridge.kt',
              'CortexApp.java'
          }
          brain=[]
          crash=[]
          for i in errors:
              loc=i.find('location')
              f=os.path.basename(loc.attrib.get('file','')) if loc is not None else ''
              if f in brain_names: brain.append((i.attrib.get('id'),f,i.attrib.get('message')))
              if i.attrib.get('id') in {'MissingPermission','UnsafeOptInUsageError','NewApi'}:
                  crash.append((i.attrib.get('id'),f,i.attrib.get('message')))
          print(f'Full-project lint debt: {len(errors)} errors')
          assert len(errors) <= 26, f'lint error count regressed: {len(errors)} > known post-fix ceiling 26'
          assert not brain, 'cognitive/staged-recovery/native-quarantine v70 lint errors: '+repr(brain)
          assert not crash, 'runtime/crash-risk lint errors remain: '+repr(crash)
          print('Cognitive/staged-recovery/native-quarantine lint gate: PASS')
          PY

      - name: Repeat brain tests from scratch for determinism
        run: gradle :app:testDebugUnitTest --rerun-tasks --stacktrace

      - name: Verify second pass stayed green
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          files=glob.glob('app/build/test-results/testDebugUnitTest/TEST-*.xml')
          assert files, 'no unit test XML files after repeatability pass'
          total=0
          bad=[]
          for p in files:
              root=ET.parse(p).getroot()
              cases=root.findall('testcase')
              total += len(cases)
              for c in cases:
                  if c.find('failure') is not None or c.find('error') is not None or c.find('skipped') is not None:
                      bad.append(p.split('/')[-1]+':'+c.attrib.get('name','?'))
          assert total >= 91, f'expected broad repeated suite including temporal attention coverage, only {total} cases found'
          assert not bad, 'repeatability failures/skips: '+','.join(bad)
          print(f'Repeatability pass: {total}/{total} tests PASS')
          PY

      - name: Upload benchmark and startup audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cortex-v70-brain-benchmark-qa
          path: |
            app/build/test-results/
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
            app/build/reports/startup-crash-audit.txt
            app/build/outputs/apk/debug/
            app/build/intermediates/merged_manifests/
            docs/CORTEX_BRAIN_BENCHMARK_V1.md
          if-no-files-found: warn
          retention-days: 14
