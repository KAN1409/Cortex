name: Cortex Round 2 Correctness Repair

on:
  push:
    branches:
      - audit/full-code-fix-v145
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cortex-round2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair-and-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: audit/full-code-fix-v145

      - name: Apply bounded correctness and performance repairs
        run: |
          python3 scripts/cortex-repair-round2.py
          git diff --check

      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '8.9'

      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Install Semgrep
        run: python3 -m pip install --disable-pip-version-check semgrep

      - name: Run full deterministic gate on repaired working tree
        run: |
          chmod +x scripts/cortex-full-code-gate.sh scripts/cortex-repo-audit.sh
          scripts/cortex-full-code-gate.sh .

      - name: Commit only verified round 2 source repairs
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'Round 2 repairs are already applied and verified.'
            exit 0
          fi
          git config user.name 'cortex-audit-bot'
          git config user.email 'cortex-audit-bot@users.noreply.github.com'
          git add app/src
          git diff --cached --check
          git commit -m 'fix: bound external inputs and remove draw-path churn [round2-fix]'
          git push origin HEAD:audit/full-code-fix-v145
