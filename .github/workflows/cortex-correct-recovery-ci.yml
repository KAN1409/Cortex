name: Cortex Correct Recovery CI

on:
  push:
    branches: [ v2/cortex-recovery-correct-baseline ]
  workflow_dispatch:

jobs:
  cortex-recovery:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout correct Cortex recovery branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Restore local Whisper runtime AAR from recovery evidence branch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/libs
          git fetch origin v2/cortex-recovery-zero-api --depth=1
          git show FETCH_HEAD:app/libs/whisper-android-cortex-prompt-1.0.0.aar > app/libs/whisper-android-cortex-prompt-1.0.0.aar
          test -s app/libs/whisper-android-cortex-prompt-1.0.0.aar

      - name: Assert Cortex product identity and v68 projection truth
        shell: bash
        run: |
          set -euo pipefail
          grep -q "applicationId 'com.kareem.cortex'" app/build.gradle
          grep -q "versionCode 68" app/build.gradle
          grep -q "1.2.4-v68-projection-root-fix" app/build.gradle
          grep -q 'android:label="Cortex"' app/src/main/AndroidManifest.xml
          grep -q '<activity android:name=".InputActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"' app/src/main/AndroidManifest.xml
          grep -q '<activity android:name=".CaptureOverviewActivity"' app/src/main/AndroidManifest.xml
          grep -q 'addNav(a,bar,"capture","Capture"' app/src/main/java/com/kareem/cortex/CortexUi.java
          ! grep -R -n -E 'Cortex Prime|Deep Review|Grounded review|AI-Assistant-TestLab' app/src/main --exclude-dir=build
          for f in UniversalEventStore UniversalEventEngine UniversalProjectionStore UniversalProjectionPolicy UniversalSemanticScheduler UniversalSemanticWorker UniversalReplayWorker UniversalReplayScheduler UniversalPipelineDiagnostics CanonicalPresentation; do test -s "app/src/main/java/com/kareem/cortex/$f.java"; done
          grep -q 'DB_VERSION = 7' app/src/main/java/com/kareem/cortex/CognitiveSchema.java
          grep -q 'UniversalProjectionPolicy.validateAttention' app/src/main/java/com/kareem/cortex/UniversalSemanticWorker.java
          grep -q 'UniversalProjectionPolicy.sanitizeExisting' app/src/main/java/com/kareem/cortex/PrimeBriefStore.java
          ! grep -q 'UniversalProjectionPolicy.sanitizeExisting(db.getWritableDatabase())' app/src/main/java/com/kareem/cortex/CaptureOverviewActivity.java
          grep -q 'void safeRefresh()' app/src/main/java/com/kareem/cortex/CaptureOverviewActivity.java
          grep -q 'renderRecovery' app/src/main/java/com/kareem/cortex/CaptureOverviewActivity.java
          grep -q "semantic_state='complete'" app/src/main/java/com/kareem/cortex/CaptureOverviewActivity.java
          grep -q 'Processing now' app/src/main/java/com/kareem/cortex/CaptureOverviewActivity.java
          grep -q 's.external_key' app/src/main/java/com/kareem/cortex/CaptureOverviewActivity.java
          ! grep -q 's.source_key FROM ue_semantic_events e JOIN ue_streams s' app/src/main/java/com/kareem/cortex/CaptureOverviewActivity.java
          grep -q "'call_event'" app/src/main/java/com/kareem/cortex/PrimeBriefStore.java
          grep -q 'sameProjection' app/src/main/java/com/kareem/cortex/PrimeBriefStore.java
          grep -q 'BRIEF / CHANGED & EVOLVING' app/src/main/java/com/kareem/cortex/ProposalUi.java
          test -s app/src/test/java/com/kareem/cortex/VaultDbV64MigrationTest.java
          test -s app/src/test/java/com/kareem/cortex/UniversalProjectionPolicyTest.java

      - name: Protect production voice path
        shell: bash
        run: |
          set -euo pipefail
          test -s app/src/main/java/com/kareem/cortex/AudioAnalyzer.java
          grep -q 'GeminiAudioTranscriber.transcribe' app/src/main/java/com/kareem/cortex/AudioAnalyzer.java
          grep -q 'runGroqFallback' app/src/main/java/com/kareem/cortex/AudioAnalyzer.java
          test -s app/src/main/java/com/kareem/cortex/CleanWhisperTranscriber.kt
          test -s app/src/main/java/com/kareem/cortex/AndroidOnDeviceAsrCandidate.java
          test -s app/src/main/java/com/kareem/cortex/GeminiNanoProbe.java

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Unit and migration tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Build inherited lint baseline from original Cortex
        shell: bash
        run: |
          set -euo pipefail
          ORIGINAL=c8c49ccc71c6b367dfecaff76351279f256d5c2d
          git fetch origin "$ORIGINAL" --depth=1
          rm -rf /tmp/cortex-original
          git worktree add --detach /tmp/cortex-original "$ORIGINAL"
          printf '\nandroid { lint { baseline = file("lint-baseline.xml") } }\n' >> /tmp/cortex-original/app/build.gradle
          gradle -p /tmp/cortex-original :app:updateLintBaseline --stacktrace
          test -s /tmp/cortex-original/app/lint-baseline.xml
          cp /tmp/cortex-original/app/lint-baseline.xml app/lint-baseline.xml
          printf '\nandroid { lint { baseline = file("lint-baseline.xml") } }\n' >> app/build.gradle

      - name: Android lint - reject new recovery errors
        run: gradle :app:lintDebug --stacktrace

      - name: Build signed update APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify final APK identity and signing
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          BUILD_TOOLS="$(find "$ANDROID_SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort -V | tail -n1)"
          AAPT="$ANDROID_SDK_ROOT/build-tools/$BUILD_TOOLS/aapt"
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/$BUILD_TOOLS/apksigner"
          BADGING="$("$AAPT" dump badging "$APK")"
          echo "$BADGING" | grep -q "package: name='com.kareem.cortex' versionCode='68'"
          echo "$BADGING" | grep -q "application-label:'Cortex'"
          echo "$BADGING" | grep -q "launchable-activity: name='com.kareem.cortex.InputActivity'"
          ! echo "$BADGING" | grep -q -E 'Cortex Prime|Deep Review|Grounded review|AI-Assistant-TestLab'
          SIGNING="$("$APKSIGNER" verify --verbose --print-certs "$APK")"
          echo "$SIGNING"
          echo "$SIGNING" | tr '[:upper:]' '[:lower:]' | grep -q '5c6550a070abe477dcad5f23f3f437e183bff8aeaeb6ac52e1beaa8243ee69a7'
          echo "$SIGNING" | grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true'
          sha256sum "$APK" | tee app/build/cortex-v68-sha256.txt

      - name: Upload Cortex v68 update
        uses: actions/upload-artifact@v4
        with:
          name: cortex-v1.2.4-v68-projection-root-fix-update
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/cortex-v68-sha256.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload QA reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cortex-v68-projection-root-fix-qa
          path: |
            app/build/reports/
            app/build/test-results/
            app/lint-baseline.xml
          if-no-files-found: warn
          retention-days: 14
