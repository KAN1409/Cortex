name: Validate Cortex Prime Groq Direct

on:
  push:
    branches: [ v1.0.23-groq-direct ]
  pull_request:
    branches: [ v1.0.1-mixed-language-voice ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Cortex Prime
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Assert direct Groq architecture
        shell: bash
        run: |
          set -euo pipefail
          test ! -e app/libs/whisper-android-cortex-prompt-1.0.0.aar
          for f in \
            app/src/main/java/com/kareem/cortex/LocalAsrModelStore.java \
            app/src/main/java/com/kareem/cortex/MultilingualWhisperTranscriber.kt \
            app/src/main/java/com/kareem/cortex/SystemAudioTranscriber.java \
            app/src/main/java/com/kareem/cortex/WhisperGgmlModel.java \
            app/src/main/java/com/kareem/cortex/WhisperProgressActivity.java \
            app/src/main/java/com/kareem/cortex/WhisperRuntimeState.java; do
            test ! -e "$f"
          done
          ! grep -R -n -E 'kareemabdelaziz\.com/ai/transcribe|whisper-android|MultilingualWhisperTranscriber|LocalAsrModelStore|WhisperRuntimeState' app/src/main app/build.gradle
          grep -q 'https://api.groq.com/openai/v1/audio/transcriptions' app/src/main/java/com/kareem/cortex/CloudAudioTranscriber.java
          grep -q 'whisper-large-v3' app/src/main/java/com/kareem/cortex/CloudAudioTranscriber.java
          grep -q 'AndroidKeyStore' app/src/main/java/com/kareem/cortex/GroqKeyStore.java

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Build release APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Prepare APK delivery
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -n 1)"
          if [ -z "$ZIPALIGN" ]; then echo 'zipalign not found' >&2; exit 1; fi
          "$ZIPALIGN" -P 16 -f 4 app/build/outputs/apk/release/app-release-unsigned.apk dist/Cortex-Prime-v1.0.23-groq-direct-aligned-unsigned.apk
          "$ZIPALIGN" -c -P 16 -v 4 dist/Cortex-Prime-v1.0.23-groq-direct-aligned-unsigned.apk
          sha256sum dist/Cortex-Prime-v1.0.23-groq-direct-aligned-unsigned.apk > dist/Cortex-Prime-v1.0.23-groq-direct-aligned-unsigned.sha256

      - name: Publish APK to delivery branch path
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p delivery
          cp dist/Cortex-Prime-v1.0.23-groq-direct-aligned-unsigned.apk delivery/
          cp dist/Cortex-Prime-v1.0.23-groq-direct-aligned-unsigned.sha256 delivery/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- delivery/Cortex-Prime-v1.0.23-groq-direct-aligned-unsigned.apk delivery/Cortex-Prime-v1.0.23-groq-direct-aligned-unsigned.sha256
          if ! git diff --cached --quiet; then
            git commit -m "Delivery: Cortex Prime v1.0.23 unsigned APK [skip ci]"
            git push origin HEAD:v1.0.23-groq-direct
          fi

      - name: Publish prerelease asset and expose temporary download URL
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="cortex-v1.0.23-groq-direct-ci"
          APK="dist/Cortex-Prime-v1.0.23-groq-direct-aligned-unsigned.apk"
          SHA="dist/Cortex-Prime-v1.0.23-groq-direct-aligned-unsigned.sha256"
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target v1.0.23-groq-direct --prerelease \
              --title "Cortex Prime v1.0.23 Groq Direct CI" \
              --notes "Temporary unsigned delivery build. Sign with the existing Cortex/Mnemo key before installing as an update."
          fi
          gh release upload "$TAG" "$APK" "$SHA" --repo "$GITHUB_REPOSITORY" --clobber
          ASSET_ID="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.assets[] | select(.name=="Cortex-Prime-v1.0.23-groq-direct-aligned-unsigned.apk") | .id' | head -n1)"
          test -n "$ASSET_ID"
          HEADERS="$RUNNER_TEMP/cortex-asset-headers.txt"
          curl -sS -D "$HEADERS" -o /dev/null --max-redirs 0 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/octet-stream" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/assets/$ASSET_ID" || true
          LOCATION="$(sed -n 's/^[Ll]ocation: //p' "$HEADERS" | tr -d '\r' | tail -n1)"
          echo "CORTEX_RELEASE_ASSET_ID=$ASSET_ID"
          if [ -n "$LOCATION" ]; then
            echo "CORTEX_TEMP_DOWNLOAD_URL=$LOCATION"
          else
            echo "CORTEX_TEMP_DOWNLOAD_URL_UNAVAILABLE"
          fi
