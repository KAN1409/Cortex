name: Cortex V2 Recovery CI

on:
  push:
    branches: [ v2/cortex-recovery-zero-api ]
  pull_request:
    branches: [ v1.0.1-mixed-language-voice, main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Protect raw voice capture baseline
        shell: bash
        run: |
          set -euo pipefail
          test -f app/src/main/java/com/kareem/cortex/AudioCapture.java
          test "$(git hash-object app/src/main/java/com/kareem/cortex/AudioCapture.java)" = "f570fc2464275e90bf559fbe20e59f9c2cc42a8a"
          grep -q 'RATE=16000' app/src/main/java/com/kareem/cortex/AudioCapture.java
          grep -q 'CHANNEL_IN_MONO' app/src/main/java/com/kareem/cortex/AudioCapture.java
          grep -q 'ENCODING_PCM_16BIT' app/src/main/java/com/kareem/cortex/AudioCapture.java

      - name: Prevent new direct paid inference integrations
        shell: bash
        run: |
          set -euo pipefail
          # Legacy cloud transcription remains temporarily as a quality reference only.
          # No new production class may add direct paid-provider endpoints or credentials.
          hits="$(grep -R -n -E 'api\.openai\.com|speech\.googleapis\.com|cognitiveservices\.azure\.com|OPENAI_API_KEY|AZURE_SPEECH_KEY|GOOGLE_SERVICE_ACCOUNT_JSON' app/src/main --exclude=CloudAudioTranscriber.java || true)"
          if [ -n "$hits" ]; then
            echo "$hits"
            echo 'New paid inference dependency detected in Android production source.' >&2
            exit 1
          fi

      - name: Run unit and recovered code-switch regression tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Android lint
        run: gradle :app:lintDebug --stacktrace

      - name: Assemble debug and release
        run: gradle :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Upload QA reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cortex-v2-recovery-qa
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
          if-no-files-found: ignore
          retention-days: 14
