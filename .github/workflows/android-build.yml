name: Android Debug APK

on:
  push:
    branches: [ main, v71/visual-memory-u1, v72/visual-memory-u2-provenance, v73/nav-picbrain, v74/u2-structured-knowledge, v80/cortex-major-unified, v81/nexus-inside-cortex, v82/chatgpt-policy-bridge, v83/intelligence-layer-reorg, v86/work-vault, v105/chatgpt-gmail-bridge, v106/gmail-bridge-fallback, v107/gmail-mime-decoder, v108/free-intelligence-comparison-teaching, v109/true-1000-scenarios-dashboard, v110/run-scoped-gmail-poll, v111/bridge-rejection-diagnostics, v112/persistent-bridge-diagnostics, v113/canonical-hash-roundtrip, v114/bridge-state-machine-root-fix, v115/convergent-gmail-poll, v116/imap-literal-root-fix, v117/dual-source-verdict-discovery, v118/structured-resolution-judge, v119/hard-explicit-request-boundary, feature/discovery-engine-v3-rebuild, feature/truth-pipeline-foundation-v159 ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cortex-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stamp v119 update-safe version
        if: github.ref_name == 'v119/hard-explicit-request-boundary'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/build.gradle')
          s=p.read_text()
          s=s.replace('versionCode 129', 'versionCode 145')
          s=s.replace("versionName '2.23.0-v109-true-1000-dashboard'", "versionName '2.33.6-v119-state-truth-throughput'")
          p.write_text(s)
          PY
          grep -E 'versionCode|versionName' app/build.gradle

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate ChatGPT bridge
        if: github.ref_name != 'feature/discovery-engine-v3-rebuild'
        working-directory: chatgpt-bridge
        run: |
          npm install --no-audit --no-fund
          npm run check

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run unit tests
        shell: bash
        run: |
          mkdir -p app/build/diagnostics
          set -o pipefail
          gradle :app:testDebugUnitTest --info --stacktrace 2>&1 | tee app/build/diagnostics/unit-test-console.log

      - name: Upload unit-test diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Cortex-v159-unit-test-diagnostics
          path: |
            app/build/diagnostics/unit-test-console.log
            app/build/test-results/testDebugUnitTest/**
            app/build/reports/tests/testDebugUnitTest/**
          if-no-files-found: error
          retention-days: 3

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Cortex-v159-truth-pipeline-foundation-ci
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
