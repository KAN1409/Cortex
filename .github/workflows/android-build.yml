name: Android Debug APK

on:
  push:
    branches: [ main, v71/visual-memory-u1, v72/visual-memory-u2-provenance, v73/nav-picbrain, v74/u2-structured-knowledge, v80/cortex-major-unified, v81/nexus-inside-cortex, v82/chatgpt-policy-bridge, v83/intelligence-layer-reorg, v86/work-vault, v105/chatgpt-gmail-bridge, v106/gmail-bridge-fallback, v107/gmail-mime-decoder ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cortex-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stamp update-safe version
        if: github.ref_name == 'v106/gmail-bridge-fallback' || github.ref_name == 'v107/gmail-mime-decoder'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          p=Path('app/build.gradle')
          s=p.read_text()
          branch=os.environ.get('GITHUB_REF_NAME','')
          if branch == 'v107/gmail-mime-decoder':
              s=s.replace('versionCode 125', 'versionCode 127')
              s=s.replace("versionName '2.19.0-v105-chatgpt-gmail-bridge'", "versionName '2.21.0-v107-gmail-mime-decoder'")
          else:
              s=s.replace('versionCode 125', 'versionCode 126')
              s=s.replace("versionName '2.19.0-v105-chatgpt-gmail-bridge'", "versionName '2.20.0-v106-gmail-bridge-fallback'")
          p.write_text(s)
          PY
          grep -E 'versionCode|versionName' app/build.gradle

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate ChatGPT bridge
        working-directory: chatgpt-bridge
        run: |
          npm install --no-audit --no-fund
          npm run check

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Cortex-v107-gmail-mime-decoder-ci
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
