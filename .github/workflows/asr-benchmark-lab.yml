name: ASR Benchmark Lab

on:
  pull_request:
    branches: [ v1.0.1-mixed-language-voice ]
    paths:
      - '.github/benchmark-trigger/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nemotron-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install prerequisites
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip 'huggingface_hub>=0.28'

      - name: Install official NeMo-Speech.cpp CPU binary
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/NVIDIA/NeMo-Speech.cpp.git nemo-speech-src
          cd nemo-speech-src
          scripts/install.sh --binary-only --backend cpu --prefix "$GITHUB_WORKSPACE/nemo-install" --no-modify-path
          "$GITHUB_WORKSPACE/nemo-install/bin/nemo-speech" --version
          ldd "$GITHUB_WORKSPACE/nemo-install/bin/nemo-speech" || true

      - name: Download official Nemotron 3.5 ASR Q8 GGUF
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from huggingface_hub import hf_hub_download
          p=hf_hub_download(
              repo_id='nvidia/nemotron-3.5-asr-streaming-0.6b',
              filename='nemotron-3.5-asr-streaming-0.6b.q8_0.gguf',
              local_dir='model',
          )
          print(p)
          PY
          echo 'a5c435f294eea8f88ce68dd27b8c3bfea7f777cb2fbba04fcd30eaa555f429ae  model/nemotron-3.5-asr-streaming-0.6b.q8_0.gguf' | sha256sum -c -
          ls -lh model/nemotron-3.5-asr-streaming-0.6b.q8_0.gguf

      - name: Split model for connector delivery
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p split
          split -b 280M -d -a 2 model/nemotron-3.5-asr-streaming-0.6b.q8_0.gguf split/nemotron.q8.gguf.part-
          sha256sum model/nemotron-3.5-asr-streaming-0.6b.q8_0.gguf > split/nemotron.q8.gguf.sha256
          ls -lh split

      - name: Upload runtime
        uses: actions/upload-artifact@v4
        with:
          name: nemo-speech-cpu-runtime
          path: nemo-install/
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

      - name: Upload model part 00
        uses: actions/upload-artifact@v4
        with:
          name: nemotron-q8-part-00
          path: split/nemotron.q8.gguf.part-00
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

      - name: Upload model part 01
        uses: actions/upload-artifact@v4
        with:
          name: nemotron-q8-part-01
          path: split/nemotron.q8.gguf.part-01
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

      - name: Upload model part 02 plus checksum
        uses: actions/upload-artifact@v4
        with:
          name: nemotron-q8-part-02
          path: |
            split/nemotron.q8.gguf.part-02
            split/nemotron.q8.gguf.sha256
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
