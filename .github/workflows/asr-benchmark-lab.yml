name: ASR Benchmark Lab

on:
  pull_request:
    branches: [ v1.0.1-mixed-language-voice ]
    paths:
      - '.github/benchmark-trigger/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  convert-tata:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Prepare converter
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/NVIDIA/NeMo-Speech.cpp.git nemo-speech-src
          cd nemo-speech-src
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt omegaconf

      - name: Download and normalize TATA checkpoint layout
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from huggingface_hub import snapshot_download
          snapshot_download(
              repo_id='yousefkotp/TATA-egyptian-arabic-asr-diarization',
              local_dir='tata-source',
              allow_patterns=['config.yaml','asr_model.ckpt','tokenizer/*'],
          )
          PY
          python - <<'PY'
          from pathlib import Path
          import shutil, yaml

          root = Path('tata-source')
          src_cfg = root / 'config.yaml'
          cfg = yaml.safe_load(src_cfg.read_text(encoding='utf-8'))
          model_cfg = cfg.get('model', cfg)
          (root / 'model_config.yaml').write_text(
              yaml.safe_dump(model_cfg, sort_keys=False, allow_unicode=True),
              encoding='utf-8',
          )
          src_cfg.unlink()
          shutil.copy2(root / 'asr_model.ckpt', root / 'model_weights.ckpt')

          tok_models = list((root / 'tokenizer').rglob('*.model'))
          if not tok_models:
              raise SystemExit('No SentencePiece tokenizer model found')
          shutil.copy2(tok_models[0], root / 'tokenizer.model')

          print('normalized files:')
          for p in sorted(root.rglob('*')):
              if p.is_file() and '.cache' not in p.parts:
                  print(p, p.stat().st_size)
          PY

      - name: Convert TATA Egyptian RNNT to Q8 GGUF
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-tata
          cd nemo-speech-src
          python convert_model.py ../tata-source \
            --architecture asr \
            --outfile ../dist-tata/tata-egyptian-rnnt.q8_0.gguf \
            --outtype q8_0
          cd ..
          sha256sum dist-tata/*.gguf > dist-tata/sha256.txt
          ls -lh dist-tata

      - name: Upload TATA Q8
        uses: actions/upload-artifact@v4
        with:
          name: tata-egyptian-rnnt-q8
          path: dist-tata/
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
