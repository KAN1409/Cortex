name: ASR Benchmark Lab

on:
  pull_request:
    branches: [ v1.0.1-mixed-language-voice ]
    paths:
      - '.github/benchmark-trigger/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  convert-lemura:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Prepare converter
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/NVIDIA/NeMo-Speech.cpp.git nemo-speech-src
          cd nemo-speech-src
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Convert Lemura Arabic ASR Lite to Q8 GGUF
        shell: bash
        run: |
          set -euo pipefail
          cd nemo-speech-src
          mkdir -p ../dist-lemura
          python convert_model.py lemuralabs/lemura-arabic-asr-lite \
            --outfile ../dist-lemura/lemura-arabic-asr-lite.q8_0.gguf --outtype q8_0
          sha256sum ../dist-lemura/*.gguf > ../dist-lemura/sha256.txt
          ls -lh ../dist-lemura
      - name: Upload Lemura Q8
        uses: actions/upload-artifact@v4
        with:
          name: lemura-arabic-asr-lite-q8
          path: dist-lemura/
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

  convert-tata:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Prepare converter
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/NVIDIA/NeMo-Speech.cpp.git nemo-speech-src
          cd nemo-speech-src
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Convert TATA Egyptian RNNT to Q8 GGUF
        shell: bash
        run: |
          set -euo pipefail
          cd nemo-speech-src
          mkdir -p ../dist-tata
          if python convert_model.py yousefkotp/TATA-egyptian-arabic-asr-diarization \
            --outfile ../dist-tata/tata-egyptian-rnnt.q8_0.gguf --outtype q8_0; then
            echo 'Remote repository conversion succeeded.'
          else
            echo 'Remote conversion did not resolve a .nemo; trying local HF snapshot.'
            python - <<'PY'
          from huggingface_hub import snapshot_download
          snapshot_download(
              repo_id='yousefkotp/TATA-egyptian-arabic-asr-diarization',
              local_dir='../tata-source',
              allow_patterns=['config.yaml','asr_model.ckpt','tokenizer/*'],
          )
          PY
            python convert_model.py ../tata-source \
              --outfile ../dist-tata/tata-egyptian-rnnt.q8_0.gguf --outtype q8_0
          fi
          sha256sum ../dist-tata/*.gguf > ../dist-tata/sha256.txt
          ls -lh ../dist-tata
      - name: Upload TATA Q8
        uses: actions/upload-artifact@v4
        with:
          name: tata-egyptian-rnnt-q8
          path: dist-tata/
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
