name: ASR Benchmark Lab

on:
  pull_request:
    branches: [ v1.0.1-mixed-language-voice ]
    paths:
      - '.github/benchmark-trigger/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  convert-tata-f16:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Prepare converter
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/NVIDIA/NeMo-Speech.cpp.git nemo-speech-src
          cd nemo-speech-src
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt omegaconf

      - name: Download normalize and inspect TATA checkpoint
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from huggingface_hub import snapshot_download
          snapshot_download(
              repo_id='yousefkotp/TATA-egyptian-arabic-asr-diarization',
              local_dir='tata-source',
              allow_patterns=['config.yaml','asr_model.ckpt','tokenizer/*'],
          )
          PY
          python - <<'PY'
          from pathlib import Path
          import shutil, yaml, torch
          from omegaconf import OmegaConf

          root = Path('tata-source')
          src_cfg = root / 'config.yaml'
          conf = OmegaConf.load(src_cfg)
          resolved = OmegaConf.to_container(conf, resolve=True)
          model_cfg = resolved.get('model', resolved)
          (root / 'model_config.yaml').write_text(
              yaml.safe_dump(model_cfg, sort_keys=False, allow_unicode=True), encoding='utf-8')
          src_cfg.unlink()
          shutil.copy2(root / 'asr_model.ckpt', root / 'model_weights.ckpt')
          tok_models = list((root / 'tokenizer').rglob('*.model'))
          if not tok_models:
              raise SystemExit('No tokenizer model')
          shutil.copy2(tok_models[0], root / 'tokenizer.model')

          ckpt = torch.load(root / 'model_weights.ckpt', map_location='cpu', weights_only=False)
          sd = ckpt.get('state_dict', ckpt)
          for key in [
              'joint.joint_net.2.weight', 'joint.joint_net.2.bias',
              'joint.enc.weight', 'joint.pred.weight',
              'decoder.prediction.embed.weight']:
              t = sd.get(key)
              print('CHECKPOINT_SHAPE', key, None if t is None else tuple(t.shape), None if t is None else str(t.dtype))
          print('CONFIG decoder vocab_size', model_cfg.get('decoder', {}).get('vocab_size'))
          print('CONFIG joint num_classes', model_cfg.get('joint', {}).get('num_classes'))
          print('CONFIG labels len', len(model_cfg.get('labels', []) or []))
          PY

      - name: Convert TATA RNNT to F16 GGUF
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-tata
          cd nemo-speech-src
          python convert_model.py ../tata-source \
            --architecture asr \
            --outfile ../dist-tata/tata-egyptian-rnnt.f16.gguf \
            --outtype fp16
          cd ..
          sha256sum dist-tata/*.gguf > dist-tata/sha256.txt
          ls -lh dist-tata

      - name: Upload TATA F16
        uses: actions/upload-artifact@v4
        with:
          name: tata-egyptian-rnnt-f16
          path: dist-tata/
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
