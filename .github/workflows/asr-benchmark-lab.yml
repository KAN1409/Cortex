name: ASR Benchmark Lab

on:
  pull_request:
    branches: [ v1.0.1-mixed-language-voice ]
    paths:
      - '.github/benchmark-trigger/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch-tiny-rescue-models:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download Whisper Tiny Q5 rescue models
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          curl -L --fail --retry 3 \
            https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny-q5_1.bin \
            -o dist/ggml-tiny-q5_1.bin
          curl -L --fail --retry 3 \
            https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.en-q5_1.bin \
            -o dist/ggml-tiny.en-q5_1.bin
          test -s dist/ggml-tiny-q5_1.bin
          test -s dist/ggml-tiny.en-q5_1.bin
          sha256sum dist/*.bin > dist/sha256.txt
          ls -lh dist

      - name: Upload Tiny rescue models
        uses: actions/upload-artifact@v4
        with:
          name: whisper-tiny-q5-rescue-models
          path: dist/
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
