name: Build Cortex APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Cortex
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Run ASR regression tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Build unsigned release APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Zipalign release and prepare signing tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/signing-tools/lib
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -n 1)"
          if [ -z "$APKSIGNER" ] || [ -z "$ZIPALIGN" ]; then echo 'Android signing tools not found' >&2; exit 1; fi
          "$ZIPALIGN" -P 16 -f 4 app/build/outputs/apk/release/app-release-unsigned.apk dist/Cortex-v1.0.15-release-aligned-unsigned.apk
          "$ZIPALIGN" -c -P 16 -v 4 dist/Cortex-v1.0.15-release-aligned-unsigned.apk
          sha256sum dist/Cortex-v1.0.15-release-aligned-unsigned.apk > dist/Cortex-v1.0.15-release-aligned-unsigned.sha256
          BT_DIR="$(dirname "$APKSIGNER")"
          cp "$APKSIGNER" dist/signing-tools/apksigner
          cp "$BT_DIR/lib/apksigner.jar" dist/signing-tools/lib/apksigner.jar
          chmod +x dist/signing-tools/apksigner

      - name: Upload Cortex APK
        uses: actions/upload-artifact@v4
        with:
          name: Cortex-v1.0.15-short-window-span-rescue
          path: dist/
          if-no-files-found: error
          retention-days: 30
