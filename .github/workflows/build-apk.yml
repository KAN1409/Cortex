name: Cortex CI

on:
  push:
    branches:
      - main
      - migration/cognitive-brain-v2-step1-2
      - fix/v2-reconciliation-v54
      - build/v2-brain-primary-v54
      - fix/v54-relay-ingress-brain-primary
      - major/cortex-brain-product-v5
  pull_request:
    branches:
      - main
      - cleanup/repo-consolidation
      - migration/cognitive-brain-v2-step1-2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Repository audit
        run: |
          case "${GITHUB_REF_NAME}" in
            build/v2-brain-primary-v54|fix/v54-relay-ingress-brain-primary|major/cortex-brain-product-v5)
              grep -Eq 'DEFAULT_AUTHORITY_MODE[[:space:]]*=[[:space:]]*CognitiveAuthorityMode\.V2_PRIMARY' app/src/main/java/com/kareem/cortex/CognitiveFeatureFlags.java
              grep -q 'android:name=".CortexLocalBusService"' app/src/main/AndroidManifest.xml
              ! grep -q 'android:name=".NotificationCaptureService"' app/src/main/AndroidManifest.xml
              echo 'BRAIN_PRIMARY_RELAY_INGRESS=PASS'
              ;;
            *)
              bash scripts/cortex-repo-audit.sh
              ;;
          esac

      - name: Build debug APK and instrumented-test sources
        run: gradle :app:assembleDebug :app:compileDebugAndroidTestJavaWithJavac --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Cortex-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
