name: Build Cortex APK

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'downloads/**'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Cortex
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK to temporary public link
        shell: bash
        run: |
          set -e
          FILE=app/build/outputs/apk/debug/app-debug.apk
          RESP=$(curl -fsSL -F "file=@${FILE}" https://tmpfiles.org/api/v1/upload)
          echo "$RESP"
          URL=$(python - <<'PY'
          import json, os
          data=json.loads(os.environ['RESP'])
          print(data['data']['url'].replace('tmpfiles.org/','tmpfiles.org/dl/'))
          PY
          )
          echo "APK_PUBLIC_URL=$URL"
        env:
          RESP: ${{ '' }}

      - name: Upload debug APK artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: Cortex-v16-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish latest APK into repo
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          mkdir -p downloads
          cp app/build/outputs/apk/debug/app-debug.apk downloads/Cortex-latest-debug.apk
          sha256sum downloads/Cortex-latest-debug.apk > downloads/Cortex-latest-debug.sha256
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/Cortex-latest-debug.apk downloads/Cortex-latest-debug.sha256
          if ! git diff --cached --quiet; then
            git commit -m "Publish latest Cortex APK [skip ci]"
            git push
          else
            echo "APK unchanged; nothing to publish"
          fi
