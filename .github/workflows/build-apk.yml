name: Build Cortex APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Cortex
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Run ASR regression tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Build debug and unsigned release APKs
        run: gradle :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Prepare APK artifacts
        shell: bash
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Cortex-v1.0.9-debug-ci-only.apk
          cp app/build/outputs/apk/release/app-release-unsigned.apk dist/Cortex-v1.0.9-release-unsigned.apk
          sha256sum dist/Cortex-v1.0.9-debug-ci-only.apk > dist/Cortex-v1.0.9-debug-ci-only.sha256
          sha256sum dist/Cortex-v1.0.9-release-unsigned.apk > dist/Cortex-v1.0.9-release-unsigned.sha256

      - name: Upload Cortex APKs
        uses: actions/upload-artifact@v4
        with:
          name: Cortex-v1.0.9-builds
          path: dist/
          if-no-files-found: error
          retention-days: 30
