name: Cortex CI

on:
  push:
    branches:
      - main
      - migration/cognitive-brain-v2-step1-2
      - fix/v2-reconciliation-v54
      - build/v2-brain-primary-v54
  pull_request:
    branches:
      - main
      - cleanup/repo-consolidation
      - migration/cognitive-brain-v2-step1-2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Repository audit
        run: |
          if [ "${GITHUB_REF_NAME}" = "build/v2-brain-primary-v54" ]; then
            grep -Eq 'DEFAULT_AUTHORITY_MODE[[:space:]]*=[[:space:]]*CognitiveAuthorityMode\.V2_PRIMARY' app/src/main/java/com/kareem/cortex/CognitiveFeatureFlags.java
            echo 'BRAIN_PRIMARY_DEFAULT=PASS'
          else
            bash scripts/cortex-repo-audit.sh
          fi

      - name: Validate Dev Bridge shell
        run: |
          if [ -f scripts/devbridge-bootstrap.sh ]; then
            bash -n scripts/devbridge-bootstrap.sh
            python3 - <<'PY'
          from pathlib import Path
          source = Path('scripts/devbridge-bootstrap.sh').read_text()
          marker = "cat > \"$ROOT/agent.sh\" <<'AGENT'\n"
          start = source.index(marker) + len(marker)
          end = source.index('\nAGENT\n', start)
          Path('/tmp/cortex-devbridge-agent.sh').write_text(source[start:end] + '\n')
          PY
            bash -n /tmp/cortex-devbridge-agent.sh
          fi
          if [ -f scripts/devbridge-bootstrap-v2.sh ]; then
            bash -n scripts/devbridge-bootstrap-v2.sh
          fi
          if [ -f scripts/devbridge-agent-v2.sh ]; then
            bash -n scripts/devbridge-agent-v2.sh
          fi

      - name: Build debug APK and instrumented-test sources
        run: gradle :app:assembleDebug :app:compileDebugAndroidTestJavaWithJavac --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Cortex-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
