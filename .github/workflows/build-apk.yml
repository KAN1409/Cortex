name: Cortex CI

on:
  push:
    branches: [ main, ci/cognitive-v2-shadow-audit ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Repository audit
        run: bash scripts/cortex-repo-audit.sh

      - name: Build debug APK and instrumented-test sources
        run: gradle :app:assembleDebug :app:compileDebugAndroidTestJavaWithJavac --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Cortex-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
