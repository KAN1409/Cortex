plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def cortexDebugKeystore = file('cortex-debug.keystore')
def cortexDebugKeystoreB64 = file('cortex-debug.keystore.b64')
if (!cortexDebugKeystore.exists() && cortexDebugKeystoreB64.exists()) {
    cortexDebugKeystore.bytes = java.util.Base64.getDecoder().decode(cortexDebugKeystoreB64.text.trim())
}

def generatedOcrAssets = file("$buildDir/generated/cortexOcrAssets")
def arabicOcrModel = file("$generatedOcrAssets/tessdata/ara.traineddata")
tasks.register('prepareArabicOcrModel') {
    outputs.file(arabicOcrModel)
    doLast {
        if (!arabicOcrModel.exists() || arabicOcrModel.length() < 500000) {
            arabicOcrModel.parentFile.mkdirs()
            def tmp = file(arabicOcrModel.absolutePath + '.part')
            if (tmp.exists()) tmp.delete()
            new URL('https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/4.1.0/ara.traineddata').withInputStream { input -> tmp.withOutputStream { output -> output << input } }
            if (tmp.length() < 500000) throw new GradleException('Arabic OCR model download was incomplete')
            if (arabicOcrModel.exists()) arabicOcrModel.delete()
            if (!tmp.renameTo(arabicOcrModel)) { arabicOcrModel.bytes = tmp.bytes; tmp.delete() }
        }
    }
}

android {
    namespace 'com.kareem.cortex'
    compileSdk 35
    buildFeatures { buildConfig true }
    sourceSets { main { assets.srcDir generatedOcrAssets } }
    signingConfigs { debug { storeFile cortexDebugKeystore; storePassword 'android'; keyAlias 'androiddebugkey'; keyPassword 'android' } }
    defaultConfig {
        applicationId 'com.kareem.cortex'
        minSdk 26
        targetSdk 35
        versionCode 50
        versionName '1.0.0-v50'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        testInstrumentationRunnerArguments clearPackageData: 'false'
    }
    buildTypes { debug { signingConfig signingConfigs.debug } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
    packagingOptions { jniLibs { useLegacyPackaging = true } }
}

preBuild.dependsOn tasks.named('prepareArabicOcrModel')

dependencies {
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    implementation 'cz.adaptech.tesseract4android:tesseract4android:4.9.0'
    implementation 'androidx.work:work-runtime:2.11.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.2.0'
    implementation 'androidx.documentfile:documentfile:1.1.0'
    implementation 'dev.ffmpegkit-maintained:llama-android:0.1.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'

    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
}
