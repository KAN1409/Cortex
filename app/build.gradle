plugins {
    id 'com.android.application'
}

def cortexDebugKeystore = file('cortex-debug.keystore')

android {
    namespace 'com.kareem.cortex.rebuild'
    compileSdk 35

    signingConfigs {
        cortexPersistentDebug {
            if (cortexDebugKeystore.exists()) {
                storeFile cortexDebugKeystore
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }

    defaultConfig {
        applicationId 'com.kareem.cortex.rebuild'
        minSdk 26
        targetSdk 35
        versionCode 7
        versionName '0.7-capture-policy'
    }

    buildTypes {
        debug {
            minifyEnabled false
            if (cortexDebugKeystore.exists()) signingConfig signingConfigs.cortexPersistentDebug
        }
        release { minifyEnabled false }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
}
