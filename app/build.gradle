plugins { id 'com.android.application' }

android {
    namespace 'com.kareem.cortex'
    compileSdk 35

    defaultConfig {
        applicationId 'com.kareem.cortex'
        minSdk 26
        targetSdk 35
        versionCode 5
        versionName '0.5.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Bundled on-device Latin-script OCR.
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    // Arabic fallback via Tesseract 5.5.1 wrapper. Language data is downloaded once at runtime.
    implementation 'cz.adaptech.tesseract4android:tesseract4android:4.9.0'
}
