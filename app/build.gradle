plugins { id 'com.android.application' }

android {
    namespace 'com.kareem.cortex'
    compileSdk 35

    defaultConfig {
        applicationId 'com.kareem.cortex'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '0.3.0'
    }
}

dependencies {
    // Bundled on-device Latin-script OCR. No model download is required at runtime.
    implementation 'com.google.mlkit:text-recognition:16.0.1'
}
