plugins {
    id 'com.android.application'
}

def cortexDebugKeystore = file('cortex-debug.keystore')

def loadCortexSigner = {
    if (!cortexDebugKeystore.exists()) return null
    java.security.KeyStore ks = null
    Exception last = null
    for (String type : ['JKS', 'PKCS12']) {
        try {
            def candidate = java.security.KeyStore.getInstance(type)
            cortexDebugKeystore.withInputStream { input -> candidate.load(input, 'android'.toCharArray()) }
            if (candidate.containsAlias('androiddebugkey')) { ks = candidate; break }
        } catch (Exception e) { last = e }
    }
    if (ks == null) throw new GradleException('Could not open cortex-debug.keystore', last)
    return ks
}

def sha256Hex = { byte[] bytes ->
    byte[] digest = java.security.MessageDigest.getInstance('SHA-256').digest(bytes)
    digest.collect { String.format('%02x', ((byte) it) & 0xff) }.join('')
}

def signerFingerprintForFile = { File keyFile ->
    if (!keyFile.isFile()) return null
    for (String type : ['JKS', 'PKCS12']) {
        for (String password : ['android', '']) {
            try {
                def candidate = java.security.KeyStore.getInstance(type)
                keyFile.withInputStream { input -> candidate.load(input, password.toCharArray()) }
                for (String alias : ['androiddebugkey', 'cortex']) {
                    def cert = candidate.getCertificate(alias)
                    if (cert != null) return sha256Hex(cert.encoded)
                }
                def aliases = candidate.aliases()
                while (aliases.hasMoreElements()) {
                    def cert = candidate.getCertificate(aliases.nextElement())
                    if (cert != null) return sha256Hex(cert.encoded)
                }
            } catch (Exception ignored) {}
        }
    }
    return null
}

android {
    namespace 'com.kareem.cortex.rebuild'
    compileSdk 35

    signingConfigs {
        cortexPersistentDebug {
            if (cortexDebugKeystore.exists()) {
                storeFile cortexDebugKeystore
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }

    defaultConfig {
        applicationId 'com.kareem.cortex.rebuild'
        minSdk 26
        targetSdk 35
        versionCode 13
        versionName '0.10.0-photo-cognition'
    }

    buildTypes {
        debug {
            minifyEnabled false
            if (cortexDebugKeystore.exists()) signingConfig signingConfigs.cortexPersistentDebug
        }
        release { minifyEnabled false }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

tasks.register('printDebugSignerFingerprint') {
    doLast {
        def ks = loadCortexSigner()
        if (ks == null) { println 'debug_signer_source=absent'; return }
        def cert = ks.getCertificate('androiddebugkey')
        if (cert == null) throw new GradleException('androiddebugkey certificate missing')
        println "debug_signer_sha256=${sha256Hex(cert.encoded)}"
    }
}

tasks.register('diagnoseCortexSignerCandidates') {
    doLast {
        def home = new File(System.getenv('HOME') ?: System.getProperty('user.home'))
        def candidates = [
                ['overlay', cortexDebugKeystore],
                ['android_debug', new File(home, '.android/debug.keystore')],
                ['rebuild_backup', new File(home, '.cortex-rebuild-signing/cortex-rebuild-permanent.keystore')],
                ['repo_source', new File(home, 'Cortex/app/cortex-debug.keystore')]
        ]
        candidates.each { pair ->
            File f = pair[1] as File
            def fp = signerFingerprintForFile(f)
            println "signer_candidate_${pair[0]}=${fp ?: 'absent_or_unreadable'}"
        }
    }
}

tasks.register('prepareDevbridgeSignedCandidate') {
    dependsOn 'assembleDebug'
    doLast {
        def ks = loadCortexSigner()
        if (ks == null) throw new GradleException('DevBridge signer overlay missing')
        def cert = ks.getCertificate('androiddebugkey')
        if (cert == null) throw new GradleException('androiddebugkey certificate missing')
        def signerFp = sha256Hex(cert.encoded)
        def home = System.getenv('HOME') ?: System.getProperty('user.home')
        def stableDir = new File(home, '.cortex-rebuild-signing')
        if (!stableDir.exists() && !stableDir.mkdirs()) throw new GradleException("Could not create ${stableDir}")
        stableDir.setReadable(false, false); stableDir.setWritable(false, false); stableDir.setExecutable(false, false)
        stableDir.setReadable(true, true); stableDir.setWritable(true, true); stableDir.setExecutable(true, true)
        def signerBackup = new File(stableDir, 'cortex-rebuild-permanent.keystore')
        byte[] sourceSigner = cortexDebugKeystore.bytes
        if (signerBackup.exists()) {
            if (sha256Hex(signerBackup.bytes) != sha256Hex(sourceSigner)) throw new GradleException('Existing permanent signer backup differs; refusing replacement')
        } else signerBackup.bytes = sourceSigner
        signerBackup.setReadable(false, false); signerBackup.setWritable(false, false); signerBackup.setExecutable(false, false)
        signerBackup.setReadable(true, true); signerBackup.setWritable(true, true)
        def builtApk = file("${buildDir}/outputs/apk/debug/app-debug.apk")
        if (!builtApk.isFile()) throw new GradleException("Signed debug APK missing: ${builtApk}")
        def stableApk = new File(stableDir, 'Cortex-0.10.0-photo-cognition-debug-diagnostic.apk')
        stableApk.bytes = builtApk.bytes
        println "diagnostic_signer_source_sha256=${signerFp}"
        println "diagnostic_debug_apk=${stableApk.absolutePath}"
    }
}

tasks.register('prepareCortex0100PermanentApk', Exec) {
    dependsOn 'assembleRelease'
    workingDir rootProject.projectDir
    commandLine 'bash', rootProject.file('scripts/devbridge-sign-stable-cortex-0100.sh').absolutePath
}

tasks.register('exportCortex0100PermanentApk', Exec) {
    dependsOn 'prepareCortex0100PermanentApk'
    workingDir rootProject.projectDir
    def home = System.getenv('HOME') ?: System.getProperty('user.home')
    commandLine 'bash', rootProject.file('scripts/devbridge-export-signed-apk.sh').absolutePath,
            new File(home, '.cortex-rebuild-signing/Cortex-0.10.0-photo-cognition-permanent.apk').absolutePath
}

tasks.register('exportDevbridgeSignedApk', Exec) {
    dependsOn 'assembleDebug'
    workingDir rootProject.projectDir
    commandLine 'bash', rootProject.file('scripts/devbridge-export-signed-apk.sh').absolutePath,
            file("${buildDir}/outputs/apk/debug/app-debug.apk").absolutePath
}

tasks.register('validateDevbridgeRecoveryState', Exec) {
    workingDir rootProject.projectDir
    commandLine 'bash', rootProject.file('scripts/devbridge-recovery-validate.sh').absolutePath
}

dependencies {
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
}
