plugins { id 'com.android.application' }

// Cortex test builds use one stable debug signing identity so installing a new
// APK upgrades the existing app instead of forcing an uninstall that wipes the
// local database and Android-Keystore-encrypted provider keys.
def cortexDebugKeystore = file('cortex-debug.keystore')
def cortexDebugKeystoreB64 = file('cortex-debug.keystore.b64')
if (!cortexDebugKeystore.exists() && cortexDebugKeystoreB64.exists()) {
    cortexDebugKeystore.bytes = java.util.Base64.getDecoder().decode(cortexDebugKeystoreB64.text.trim())
}

android {
    namespace 'com.kareem.cortex'
    compileSdk 35

    signingConfigs {
        debug {
            storeFile cortexDebugKeystore
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    defaultConfig {
        applicationId 'com.kareem.cortex'
        minSdk 26
        targetSdk 35
        versionCode 35
        versionName '1.0.0-v35'
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    implementation 'cz.adaptech.tesseract4android:tesseract4android:4.9.0'
    implementation 'androidx.work:work-runtime:2.11.2'
}
