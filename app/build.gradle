plugins {
    id 'com.android.application'
}

android {
    namespace 'com.kareem.cortex.rebuild'
    compileSdk 35

    defaultConfig {
        applicationId 'com.kareem.cortex.rebuild'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.2-relay-intake'
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
}