plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def cortexDebugKeystore = file('cortex-debug.keystore')
def cortexDebugKeystoreB64 = file('cortex-debug.keystore.b64')
if (!cortexDebugKeystore.exists() && cortexDebugKeystoreB64.exists()) {
    cortexDebugKeystore.bytes = java.util.Base64.getDecoder().decode(cortexDebugKeystoreB64.text.trim())
}

android {
    namespace 'com.kareem.cortex'
    compileSdk 35

    if (cortexDebugKeystore.exists()) {
        signingConfigs {
            debug {
                storeFile cortexDebugKeystore
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }

    defaultConfig {
        applicationId 'com.kareem.cortex'
        minSdk 26
        targetSdk 35
        versionCode 60
        versionName '1.1.0-v60-recovery'
    }

    buildTypes {
        debug {
            if (cortexDebugKeystore.exists()) signingConfig signingConfigs.debug
        }
    }

    androidResources {
        // Keep user-imported whisper.cpp GGML model files stored verbatim.
        noCompress += ['bin']
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    implementation 'cz.adaptech.tesseract4android:tesseract4android:4.9.0'
    implementation 'androidx.work:work-runtime:2.11.2'

    // On-device Gemini Nano/AICore probe. This is local inference infrastructure,
    // not a paid Cortex API dependency.
    implementation 'com.google.mlkit:genai-prompt:1.0.0-beta2'

    // Recovery branch: resurrect the proven local Whisper runtime in parallel with
    // the legacy cloud transcription code. The legacy path remains untouched until
    // the local engine passes the saved-voice-note benchmark.
    implementation files('libs/whisper-android-cortex-prompt-1.0.0.aar')
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'

    testImplementation 'junit:junit:4.13.2'
}
