plugins { id 'com.android.application' }

def primeKeystorePath = System.getenv('CORTEX_PRIME_KEYSTORE')
def primeStorePassword = System.getenv('CORTEX_PRIME_STORE_PASSWORD')
def primeKeyAlias = System.getenv('CORTEX_PRIME_KEY_ALIAS')
def primeKeyPassword = System.getenv('CORTEX_PRIME_KEY_PASSWORD')
def hasPrimePermanentSigner = primeKeystorePath && primeStorePassword && primeKeyAlias && primeKeyPassword && file(primeKeystorePath).exists()

android {
    namespace 'com.kareem.cortex.prime'
    compileSdk 35
    defaultConfig {
        applicationId 'com.kareem.cortex.prime'
        minSdk 26
        targetSdk 35
        versionCode 8
        versionName '0.4.1-prime-secure-signer'
    }
    signingConfigs {
        if (hasPrimePermanentSigner) {
            permanent {
                storeFile file(primeKeystorePath)
                storePassword primeStorePassword
                keyAlias primeKeyAlias
                keyPassword primeKeyPassword
            }
        }
    }
    buildTypes {
        debug {
            if (hasPrimePermanentSigner) signingConfig signingConfigs.permanent
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

tasks.register('assertPrimePermanentSigner') {
    doLast {
        if (!hasPrimePermanentSigner) {
            throw new GradleException('Cortex Prime permanent signer is not available in the local environment')
        }
    }
}

tasks.register('assemblePrimeBridgeDebug') {
    dependsOn 'assembleDebug'
}

tasks.register('assemblePrimePermanentDebug') {
    dependsOn 'assertPrimePermanentSigner', 'assembleDebug'
}

dependencies {
    implementation project(':core-evidence')
    implementation project(':capture-relay')
    implementation project(':capture-voice')
    implementation project(':capture-vision')
    implementation project(':local-intelligence')
}
