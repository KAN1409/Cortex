plugins { id 'com.android.application' }

android {
    namespace 'com.kareem.cortex.prime'
    compileSdk 35
    defaultConfig {
        applicationId 'com.kareem.cortex.prime'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.1.1-prime-relay-capture'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation project(':core-evidence')
    implementation project(':capture-relay')
}
