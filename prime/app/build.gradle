plugins { id 'com.android.application' }

def primePermanentKeystore = file('../../app/cortex-debug.keystore')
def primePermanentKeystoreB64 = file('../../app/cortex-debug.keystore.b64')
if (!primePermanentKeystore.exists() && primePermanentKeystoreB64.exists()) {
    primePermanentKeystore.bytes = java.util.Base64.getDecoder().decode(primePermanentKeystoreB64.text.trim())
}

android {
    namespace 'com.kareem.cortex.prime'
    compileSdk 35
    defaultConfig {
        applicationId 'com.kareem.cortex.prime'
        minSdk 26
        targetSdk 35
        versionCode 7
        versionName '0.4.0-prime-now-normalizer-v2'
    }
    signingConfigs {
        if (primePermanentKeystore.exists()) {
            permanent {
                storeFile primePermanentKeystore
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }
    buildTypes {
        debug {
            if (primePermanentKeystore.exists()) signingConfig signingConfigs.permanent
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

tasks.register('assemblePrimeBridgeDebug') {
    dependsOn 'assembleDebug'
}

dependencies {
    implementation project(':core-evidence')
    implementation project(':capture-relay')
    implementation project(':capture-voice')
    implementation project(':capture-vision')
    implementation project(':local-intelligence')
}
