plugins { id 'com.android.application' }

android {
    namespace 'com.kareem.cortex.prime'
    compileSdk 35
    defaultConfig {
        applicationId 'com.kareem.cortex.prime'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0-prime-foundation'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation project(':core-evidence')
}
